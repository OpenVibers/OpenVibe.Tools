<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--OV:HEAD-->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%230b1220'/%3E%3Ccircle cx='24' cy='24' r='18' fill='none' stroke='%233b82f6' stroke-width='4'/%3E%3Cpath d='M14.5 17 24 34l9.5-17' fill='none' stroke='%23fff' stroke-width='4.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and above the stylesheets.
     Paints the cached theme synchronously so the default palette never flashes. Reads
     localStorage only: no network, nothing to block on. theme-loader.js still runs after
     and reconciles with the account. -->
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar injected by OpenVibeNavbar.init() -->

    <div id="app">
        <!-- Hero -->
        <section class="hero">
            <div class="hero-icon"><i class="fa-solid fa-circle-play"></i></div>
            <h1>YT.OpenVibe</h1>
            <p class="hero-subtitle">YouTube Downloader</p>
        </section>

        <!-- URL Input -->
        <section class="url-section">
            <div class="url-input-wrap">
                <i class="fa-solid fa-link url-icon"></i>
                <input type="url" id="url-input" class="url-input" placeholder="Paste YouTube URL here..." autocomplete="off">
                <button class="btn btn-primary" id="fetch-btn"><i class="fa-solid fa-magnifying-glass"></i> <span class="btn-label">Fetch</span></button>
            </div>
            <p class="url-hint">Supports youtube.com and youtu.be links</p>
        </section>

        <!-- Loading -->
        <section class="loading" id="loading" style="display:none">
            <div class="spinner"></div>
            <p>Fetching video info...</p>
        </section>

        <!-- Video Info -->
        <section class="video-card" id="video-card" style="display:none">
            <div class="video-thumb" id="video-thumb"></div>
            <div class="video-info" id="video-info"></div>
        </section>

        <!-- Format Selection -->
        <section class="format-section" id="format-section" style="display:none">
            <h3>Choose Format</h3>
            <div class="format-groups">
                <div class="format-group">
                    <h4><i class="fa-solid fa-video"></i> Video</h4>
                    <div class="format-list" id="video-formats"></div>
                </div>
                <div class="format-group">
                    <h4><i class="fa-solid fa-music"></i> Audio Only</h4>
                    <div class="format-list" id="audio-formats"></div>
                </div>
            </div>
            <button class="btn btn-primary btn-lg" id="download-btn">
                <i class="fa-solid fa-download"></i> Download
            </button>
        </section>

        <!-- Download Progress -->
        <section class="progress-section" id="progress-section" style="display:none">
            <h3 id="progress-title">Downloading...</h3>
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="progress-stats" id="progress-stats"></div>
        </section>

        <!-- Download Ready -->
        <section class="done-section" id="done-section" style="display:none">
            <div class="done-icon"><i class="fa-solid fa-circle-check"></i></div>
            <h3>Ready!</h3>
            <p id="done-info"></p>
            <div class="done-actions">
                <a class="btn btn-primary btn-lg" id="save-btn" href="#" download>
                    <i class="fa-solid fa-download"></i> Save File
                </a>
                <button class="btn btn-secondary" id="new-btn">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Download Another
                </button>
            </div>
        </section>

        <!-- Error -->
        <section class="error-section" id="error-section" style="display:none">
            <div class="error-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
            <p id="error-msg"></p>
            <button class="btn btn-secondary" id="retry-btn"><i class="fa-solid fa-arrow-rotate-left"></i> Try Again</button>
        </section>
    </div>

    <!-- Footer -->
    <!--OV:CONTENT-->
    <div id="ov-footer"></div>

    <script src="https://openvibe.network/shared/theme-loader.js"></script>
    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="https://openvibe.network/shared/ov-icons.js" defer></script>
    <script src="https://openvibe.network/shared/island.js" defer></script>
    <script src="/js/download-state.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
