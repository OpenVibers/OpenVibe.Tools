# ═══════════════════════════════════════════════════════════════
# Docs.OpenVibe — Nginx Vhost
# Single backend serving all document/PDF subdomain hostnames.
# ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=openvibedocs_api:10m rate=5r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name
        docs.openvibe.tools
        pdf.openvibe.tools
        mergepdf.openvibe.tools splitpdf.openvibe.tools compresspdf.openvibe.tools
        rotatepdf.openvibe.tools reorderpdf.openvibe.tools watermarkpdf.openvibe.tools
        protectpdf.openvibe.tools unlockpdf.openvibe.tools
        image2pdf.openvibe.tools jpg2pdf.openvibe.tools png2pdf.openvibe.tools
        pdf2jpg.openvibe.tools pdf2png.openvibe.tools;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name
        docs.openvibe.tools
        pdf.openvibe.tools
        mergepdf.openvibe.tools splitpdf.openvibe.tools compresspdf.openvibe.tools
        rotatepdf.openvibe.tools reorderpdf.openvibe.tools watermarkpdf.openvibe.tools
        protectpdf.openvibe.tools unlockpdf.openvibe.tools
        image2pdf.openvibe.tools jpg2pdf.openvibe.tools png2pdf.openvibe.tools
        pdf2jpg.openvibe.tools pdf2png.openvibe.tools;

    ssl_certificate     /etc/letsencrypt/live/openvibe.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.tools/privkey.pem;

    access_log /var/log/nginx/docs.openvibe.tools.access.log;
    error_log  /var/log/nginx/docs.openvibe.tools.error.log;

    # Allow larger uploads for PDF files
    client_max_body_size 100m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API routes (rate limited)
    # Prometheus metrics are for loopback scrapes only (the app also 404s any proxied caller).
    location = /metrics {
        return 404;
    }

    location /api/ {
        limit_req zone=openvibedocs_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for PDF processing
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static assets + SPA fallback
    location / {
        proxy_pass http://127.0.0.1:4016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
