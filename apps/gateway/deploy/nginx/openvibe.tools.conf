# ═══════════════════════════════════════════════════════════════
# openvibe.tools + *.openvibe.tools — Nginx Configuration
#
# The gateway (port 4001) serves the apex directory plus every
# Host-header-routed tool subdomain (net.*, dev.*, pastes.*, and
# their many aliases). The seven satellite apps have their own
# server blocks (see apps/<name>/deploy/nginx/) which match their
# specific server_names BEFORE this wildcard catches the rest.
#
# Let's Encrypt wildcard TLS + Cloudflare proxy.
# ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovtools_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovtools_auth:10m rate=10r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.tools *.openvibe.tools;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.tools *.openvibe.tools;

    ssl_certificate     /etc/letsencrypt/live/openvibe.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.tools/privkey.pem;

    access_log /var/log/nginx/openvibe.tools.access.log;
    error_log  /var/log/nginx/openvibe.tools.error.log;

    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── OAuth session endpoints (strict rate limit) ─────────
    # Prometheus metrics are for loopback scrapes only (the app also 404s any proxied caller).
    location = /metrics {
        return 404;
    }

    location /auth/ {
        limit_req zone=ovtools_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Run API and jobs facade (ADR-027): uploads stream to the satellites, SSE streams back ──
    # POST /api/v1/tools/:id/run takes files like the satellites do (docs: 100 MB each); wait_ms holds a
    # run open up to 60 s; /api/v1/jobs/:id/events is a long-lived event stream.
    location ~ ^/api/v1/(tools/[a-z0-9-]+/run|jobs)(/|$) {
        limit_req zone=ovtools_api burst=30 nodelay;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API (moderate rate limit) ───────────────────────────
    location /api/ {
        limit_req zone=ovtools_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
