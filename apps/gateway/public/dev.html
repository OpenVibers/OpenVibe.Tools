const host=location.hostname,sub=host.replace(/\.openvibe\.tools$/,'');
const META=(document.querySelector('meta[name="ov-tool"]')||{}).content||'';
let ACT=T[META]?META:(T[sub]?sub:'dev'),MODE='';

document.addEventListener('DOMContentLoaded',()=>{
    const tok=localStorage.getItem('ov_token');
    const cur=T[ACT]||T.dev;
    if(window.OpenVibeNavbar)try{OpenVibeNavbar.init({service:'dev',apiBase:'https://openvibe.network',token:tok,history:{type:'tool',title:ACT==='dev'?'Dev.OpenVibe':cur.n},silentLogin:'https://openvibe.tools/auth/login?silent=1&next={url}'})}catch(e){}
    if(window.OpenVibeFooter)try{
        // Footer columns come from the same catalog as the hub, one column per category.
        const links=Object.entries(CATS).map(([cid,cat])=>({heading:cat.l,items:Object.entries(T).filter(([,t])=>t.c===cid).map(([id,t])=>({name:t.n,url:'https://'+id+'.openvibe.tools'}))})).filter(g=>g.items.length);
        OpenVibeFooter.init({service:'dev',variant:ACT==='dev'?'full':'compact',mount:'#ov-footer',apiBase:'https://openvibe.network',links});
    }catch(e){}
    ACT==='dev'?showHub():showTool();
});

function showHub(){
    $('hub').style.display='';$('tool').style.display='none';
    let h='';
    for(const[cid,cat]of Object.entries(CATS)){
        const tools=Object.entries(T).filter(([,t])=>t.c===cid);
        if(!tools.length)continue;
        h+='<div class="ch"><i class="fa-solid '+cat.i+'"></i> '+cat.l+'</div><div class="hg">';
        for(const[id,t]of tools) h+='<a class="tc" href="https://'+id+'.openvibe.tools"><div class="tc-i"><i class="fa-solid '+t.i+'"></i></div><div><div class="tc-n">'+t.n+'</div><div class="tc-d">'+t.d+'</div></div></a>';
        h+='</div>';
    }
    $('hub').innerHTML=h;
    buildRel();
}

function showTool(){
    $('hub').style.display='none';$('tool').style.display='';
    const t=T[ACT];if(!t)return showHub();
    $('hi').innerHTML='<i class="fa-solid '+t.i+'"></i>';
    $('ht').textContent=t.n;$('hd').textContent=t.d;
    // Title comes from the server (server/seo) so crawlers and the tab agree — don't clobber it.
    if(!document.querySelector('link[rel=canonical][href*="'+ACT+'.openvibe"]'))document.title=t.n+' \u2014 '+t.d;
    let mh='';
    if(t.m)t.m.forEach((m,i)=>{mh+='<button class="mb'+(i===0?' on':'')+'" data-m="'+m+'" onclick="setMode(this)">'+m+'</button>'});
    $('modes').innerHTML=mh;MODE=t.m?t.m[0]:'';
    let ioh='<textarea id="in1" spellcheck="false" placeholder="'+H(t.p||'Paste here...')+'"></textarea>';
    if(t.dual)ioh+='<textarea id="in2" spellcheck="false" placeholder="'+H(t.p2||'')+'"></textarea>';
    $('io').innerHTML=ioh;
    let ah='<button class="ab ab-go" onclick="run()"><i class="fa-solid fa-play"></i> Run</button>';
    ah+='<button class="ab ab-s" onclick="copyOut()"><i class="fa-solid fa-copy"></i> Copy</button>';
    ah+='<button class="ab ab-s" onclick="clr()"><i class="fa-solid fa-trash"></i> Clear</button>';
    ah+='<button class="ab ab-s" onclick="sample()"><i class="fa-solid fa-flask"></i> Sample</button>';
    $('acts').innerHTML=ah;
    buildRel();
    const q=new URLSearchParams(location.search).get('q');
    if(q){$('in1').value=q;run()}
    else if(['uuid','lorem','timestamp','color'].includes(ACT)){if(t.p)$('in1').value=t.p;run()}
}

function setMode(el){document.querySelectorAll('.mb').forEach(b=>b.classList.remove('on'));el.classList.add('on');MODE=el.dataset.m;run()}

function buildRel(){
    const cat=T[ACT]?.c;let h='';
    for(const[id,t]of Object.entries(T)){if(id===ACT||t.hub||t.c!==cat)continue;h+='<a href="https://'+id+'.openvibe.tools"><i class="fa-solid '+t.i+'"></i> '+t.n+'</a>'}
    if(['curlconvert','webhook'].includes(ACT))h+='<a href="https://headers.openvibe.tools"><i class="fa-solid fa-heading"></i> Headers</a><a href="https://ssl.openvibe.tools"><i class="fa-solid fa-lock"></i> SSL</a>';
    if(ACT==='opengraph')h+='<a href="https://logo.openvibe.tools"><i class="fa-solid fa-wand-magic-sparkles"></i> Logo.OpenVibe</a>';
    $('rel').innerHTML=h;
}

}

P.entities=(s,m)=>{
    if(m==='HTML Enc')return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    if(m==='HTML Dec'){const d=document.createElement('div');d.innerHTML=s;return d.textContent}
    if(m==='JS Esc')return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t');
    if(m==='JS Unesc')return s.replace(/\\n/g,'\n').replace(/\\r/g,'\r').replace(/\\t/g,'\t').replace(/\\"/g,'"').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
    if(m==='URL Enc')return encodeURIComponent(s);return decodeURIComponent(s);

const loadScript=(src)=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('Could not load the minifier. Check your connection and try again.'));document.head.appendChild(e)});
const terser=async()=>{if(!window.Terser)await loadScript('https://cdn.jsdelivr.net/npm/terser@5/dist/bundle.min.js');return window.Terser};
const saved=(a,b)=>{const x=new Blob([a]).size,y=new Blob([b]).size;return x?`${x.toLocaleString()} → ${y.toLocaleString()} bytes (${Math.max(0,Math.round((1-y/x)*100))}% smaller)`:''};
const withNote=(code,note)=>({html:(note?'<div style="color:var(--tx2);font-size:.8rem;margin-bottom:8px">'+H(note)+'</div>':'')+'<pre style="margin:0;white-space:pre-wrap;word-break:break-word">'+H(code)+'</pre>'});
P.jsminify=async(s,m)=>{const T=await terser();const r=await T.minify(s,m==='Whitespace only'?{compress:false,mangle:false}:{compress:true,mangle:m==='Minify + mangle'});return withNote(r.code||'',saved(s,r.code||''))};
P.jsformat=async(s)=>{const T=await terser();const r=await T.minify(s,{compress:false,mangle:false,format:{beautify:true,comments:'all',indent_level:2}});return r.code||''};
P.cssminify=(s)=>{const o=DevEngine.cssMinify(s);return withNote(o,saved(s,o))};
P.cssformat=(s)=>DevEngine.cssFormat(s);
P.htmlminify=(s)=>{const o=DevEngine.htmlMinify(s);return withNote(o,saved(s,o))};
P.xmlminify=(s)=>{const d=new DOMParser().parseFromString(s,'application/xml');const er=d.querySelector('parsererror');if(er)throw new Error(er.textContent.split('\n')[0]);
    const keep=[];let o=s.replace(/<!\[CDATA\[[\s\S]*?\]\]>/g,(m)=>{keep.push(m);return'\u0000'+(keep.length-1)+'\u0000'}).replace(/<!--[\s\S]*?-->/g,'').replace(/>\s+</g,'><').trim().replace(/\u0000(\d+)\u0000/g,(_,i)=>keep[+i]);return withNote(o,saved(s,o))};
P.jsonminify=(s)=>{const o=DevEngine.jsonMinify(s);return withNote(o,saved(s,o))};
P.jsonvalidate=(s)=>{const j=DevEngine.jsonStats(s);
    return'\u2713 Valid JSON\n\nTop level: '+j.kind+(j.kind==='array'?' with '+j.size+' items':j.kind==='object'?' with '+j.size+' keys':'')+'\nValues: '+j.values.toLocaleString()+'\nDeepest nesting: '+j.depth};
P.jsonparse=(s,m)=>DevEngine.jsonParse(s,m);
P.jsonstringify=(s,m)=>DevEngine.jsonStringify(s,m);
P.html2md=(s)=>{const doc=new DOMParser().parseFromString(s,'text/html');const esc=(t)=>t.replace(/([\\`*_{}\[\]#|])/g,'\\$1');
    const inline=(n)=>[...n.childNodes].map(node).join('');
    const list=(n,ord,depth)=>[...n.children].filter(c=>c.tagName==='LI').map((li,i)=>'  '.repeat(depth)+(ord?(i+1)+'. ':'- ')+[...li.childNodes].map(c=>c.nodeType===1&&/^(UL|OL)$/.test(c.tagName)?'\n'+list(c,c.tagName==='OL',depth+1):node(c)).join('').trim()).join('\n');
    function node(n){if(n.nodeType===3)return esc(n.nodeValue.replace(/\s+/g,' '));if(n.nodeType!==1)return'';const t=n.tagName;
        if(/^(SCRIPT|STYLE|NOSCRIPT|TEMPLATE|IFRAME|FORM|INPUT|BUTTON|SELECT|TEXTAREA|SVG|HEAD)$/.test(t))return'';
        if(/^H[1-6]$/.test(t))return'\n\n'+'#'.repeat(+t[1])+' '+inline(n).trim()+'\n\n';
        if(t==='P'||t==='DIV'||t==='SECTION'||t==='ARTICLE'||t==='HEADER'||t==='FOOTER'||t==='MAIN')return'\n\n'+inline(n).trim()+'\n\n';
        if(t==='BR')return'  \n';if(t==='HR')return'\n\n---\n\n';
        if(t==='STRONG'||t==='B'){const x=inline(n).trim();return x?'**'+x+'**':''}if(t==='EM'||t==='I'){const x=inline(n).trim();return x?'*'+x+'*':''}
        if(t==='DEL'||t==='S')return'~~'+inline(n).trim()+'~~';
        if(t==='CODE'&&n.parentNode.tagName!=='PRE')return'`'+n.textContent+'`';
        if(t==='PRE'){const c=n.querySelector('code');const lang=c&&(/language-([\w-]+)/.exec(c.className)||[])[1]||'';return'\n\n```'+lang+'\n'+n.textContent.replace(/\n$/,'')+'\n```\n\n'}
        if(t==='A'){const h=n.getAttribute('href')||'';const x=inline(n).trim();return h&&!/^javascript:/i.test(h)?'['+(x||h)+']('+h+')':x}
        if(t==='IMG'){const src=n.getAttribute('src')||'';return src?'!['+esc(n.getAttribute('alt')||'')+']('+src+')':''}
        if(t==='UL'||t==='OL')return'\n\n'+list(n,t==='OL',0)+'\n\n';
        if(t==='BLOCKQUOTE')return'\n\n'+inline(n).trim().split('\n').map(l=>'> '+l).join('\n')+'\n\n';
        if(t==='TABLE'){const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(c=>inline(c).trim().replace(/\|/g,'\\|').replace(/\n+/g,' ')));if(!rows.length)return'';const w=Math.max(...rows.map(r=>r.length));const line=(r)=>'| '+Array.from({length:w},(_,i)=>r[i]||'').join(' | ')+' |';return'\n\n'+line(rows[0])+'\n|'+' --- |'.repeat(w)+'\n'+rows.slice(1).map(line).join('\n')+'\n\n'}
        return inline(n)}
    return node(doc.body).replace(/[ \t]+\n/g,(m)=>m.startsWith('  ')?'  \n':'\n').replace(/\n{3,}/g,'\n\n').trim()};
P.md2html=(s,m)=>{const h=DevEngine.md2html(s);return m==='Preview'?{html:'<div style="line-height:1.8">'+h+'</div>'}:h};
P.minify=(s,m)=>DevEngine.minify(s,m);

P.codediff=(a,m,b)=>{
    const al=a.split('\n'),bl=b.split('\n'),r=[];let ai=0,bi=0;
    while(ai<al.length||bi<bl.length){
        if(ai<al.length&&bi<bl.length&&al[ai]===bl[bi]){r.push({t:'c',n:ai+1,l:al[ai]});ai++;bi++}
        else if(bi<bl.length&&(ai>=al.length||bl.slice(bi,bi+4).includes(al[ai])===false)){r.push({t:'a',n:bi+1,l:bl[bi]});bi++}
        else{r.push({t:'d',n:ai+1,l:al[ai]});ai++}
    }
    const st={a:r.filter(x=>x.t==='a').length,d:r.filter(x=>x.t==='d').length,c:r.filter(x=>x.t==='c').length};
    return{html:'<div style="margin-bottom:8px;font-size:.82rem;color:var(--tx2)"><span class="ok">+'+st.a+' added</span> \u00b7 <span class="err">-'+st.d+' removed</span> \u00b7 '+st.c+' unchanged</div>'+r.map(x=>'<div class="dl d'+x.t+'"><span class="ln">'+x.n+'</span><span class="lc">'+H(x.l)+'</span></div>').join('')};
};

P.regex=(pat,m,test)=>{
    if(!pat)throw new Error('Enter a regex pattern');
    const re=new RegExp(pat,'gm');let match,matches=[],last=0,html='';
    while((match=re.exec(test))!==null){if(match.index>last)html+=H(test.slice(last,match.index));html+='<span class="mh">'+H(match[0])+'</span>';matches.push({m:match[0],i:match.index,g:match.slice(1)});last=match.index+match[0].length;if(!match[0].length){re.lastIndex++;if(re.lastIndex>test.length)break}}
    if(last<test.length)html+=H(test.slice(last));
    let info='<div style="margin-bottom:8px;font-size:.82rem;color:var(--tx2)">'+matches.length+' match'+(matches.length!==1?'es':'')+' found</div><div style="white-space:pre-wrap;line-height:1.8">'+(html||H(test))+'</div>';
    if(matches.some(x=>x.g.length)){info+='<div style="margin-top:10px;font-size:.82rem;color:var(--tx2)">Groups:</div>';matches.forEach((x,i)=>{if(x.g.length)info+='<div style="font-size:.82rem">#'+(i+1)+': '+x.g.map((g,j)=>'<span style="color:var(--ac)">$'+(j+1)+'</span>='+H(g||'')).join(', ')+'</div>'})}
    return{html:info};
};
