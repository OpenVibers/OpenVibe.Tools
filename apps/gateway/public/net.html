    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0c12;
            --bg-secondary: #12131c;
            --bg-tertiary: #1a1b28;
            --bg-card: rgba(22, 24, 36, 0.85);
            --bg-hover: #252738;
            --bg-input: #181926;
            --text-primary: #f1f4fb;
            --text-secondary: #a0a8c4;
            --text-muted: #5e6580;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-dark: #6d28d9;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
            --cyan: #06b6d4;
            --border: rgba(255,255,255,0.07);
            --border-light: rgba(255,255,255,0.12);
            --shadow: 0 24px 64px rgba(0,0,0,0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-primary); scroll-behavior: smooth; }
        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent-light); text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { font: inherit; cursor: pointer; border: none; background: none; }

        /* ─── Background glow ─── */
        .bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg-glow::before, .bg-glow::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(120px); opacity: 0.35;
            animation: glow-drift 20s ease-in-out infinite alternate;
        }
        .bg-glow::before { width: 500px; height: 500px; top: -5%; left: 25%; background: radial-gradient(circle, rgba(6,182,212,0.3), transparent 70%); }
        .bg-glow::after { width: 400px; height: 400px; bottom: 10%; right: 15%; background: radial-gradient(circle, rgba(139,92,246,0.25), transparent 70%); animation-delay: -10s; }
        @keyframes glow-drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

        .page { position: relative; z-index: 1; min-height: 100vh; }
        .shell { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }

        /* ─── Navbar placeholder ─── */
        .nav-placeholder { height: 52px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }

        /* ─── Hero ─── */
        .hero { text-align: center; padding: 48px 0 24px; }
        .hero-icon { font-size: 40px; color: var(--cyan); margin-bottom: 12px; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.5px; margin-bottom: 8px; }
        .hero h1 .accent { color: var(--cyan); }
        .hero .sub { color: var(--text-secondary); font-size: 1rem; max-width: 560px; margin: 0 auto; line-height: 1.5; }

        /* ─── Search bar ─── */
        .search-bar {
            display: flex; gap: 8px; max-width: 640px; margin: 24px auto 0;
            background: var(--bg-input); border: 1px solid var(--border-light);
            border-radius: 14px; padding: 6px 6px 6px 16px; align-items: center;
            transition: border-color .2s;
        }
        .search-bar:focus-within { border-color: var(--cyan); }
        .search-bar input {
            flex: 1; background: none; border: none; outline: none;
            font-size: 15px; color: var(--text-primary); padding: 10px 0;
            font-family: var(--mono);
        }
        .search-bar input::placeholder { color: var(--text-muted); font-family: 'Inter', sans-serif; }
        .search-bar .btn-go {
            padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 14px;
            background: var(--cyan); color: #fff; white-space: nowrap;
            transition: background .15s, transform .1s;
        }
        .search-bar .btn-go:hover { background: #0891b2; }
        .search-bar .btn-go:active { transform: scale(0.97); }

        /* ─── Tool chips (quick-pick on hub) ─── */
        .tool-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
        .tool-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border-radius: 8px;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            font-size: 12px; color: var(--text-secondary); font-weight: 500;
            transition: all .15s; cursor: pointer;
        }
        .tool-chip:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
        .tool-chip.active { background: rgba(6,182,212,0.12); border-color: var(--cyan); color: var(--cyan); }
        .tool-chip i { font-size: 11px; opacity: 0.7; }

        /* ─── Tool selector row (shown on individual tool pages) ─── */
        .tool-selector { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        .tool-selector .ts-btn {
            padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-secondary); transition: all .15s;
        }
        .tool-selector .ts-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .tool-selector .ts-btn.active { background: rgba(6,182,212,0.15); border-color: var(--cyan); color: var(--cyan); }

        /* ─── Options row ─── */
        .options-row {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            margin-top: 12px; font-size: 13px;
        }
        .options-row label {
            display: flex; align-items: center; gap: 4px; color: var(--text-secondary);
            cursor: pointer;
        }
        .options-row select, .options-row input[type="text"] {
            background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 6px; padding: 4px 8px; color: var(--text-primary);
            font-size: 12px; font-family: var(--mono);
        }

        /* ─── Results area ─── */
        .results { margin-top: 28px; padding-bottom: 60px; }

        /* Status badges row */
        .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
            background: var(--bg-tertiary); border: 1px solid var(--border);
        }
        .badge-green { color: var(--green); border-color: rgba(34,197,94,0.25); background: rgba(34,197,94,0.08); }
        .badge-red { color: var(--red); border-color: rgba(239,68,68,0.25); background: rgba(239,68,68,0.08); }
        .badge-yellow { color: var(--yellow); border-color: rgba(245,158,11,0.25); background: rgba(245,158,11,0.08); }
        .badge-blue { color: var(--blue); border-color: rgba(59,130,246,0.25); background: rgba(59,130,246,0.08); }
        .badge-cyan { color: var(--cyan); border-color: rgba(6,182,212,0.25); background: rgba(6,182,212,0.08); }

        /* Result card */
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px;
            backdrop-filter: blur(16px);
        }
        .card-head {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
            font-size: 14px; font-weight: 700; color: var(--cyan);
        }
        .card-head i { font-size: 13px; }

        /* Result table */
        .res-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        /* The domain's history (WHOIS / RDAP): when it was first seen here and what changed when. */
        .hist-note { margin: 0 0 8px; font-size: 13px; color: var(--text-secondary, #a8b3c4); }
        .hist-note b { color: var(--text-primary, #e6edf7); }
        .hist-list { list-style: none; margin: 4px 0 8px; padding: 0 0 0 14px; border-left: 2px solid var(--border, rgba(255,255,255,.12)); display: grid; gap: 10px; }
        .hist-list > li { position: relative; font-size: 13px; }
        .hist-list > li::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent, #3b82f6); }
        .hist-day { display: block; font-weight: 700; font-size: 12px; color: var(--text-muted, #8693a8); margin-bottom: 2px; }
        .hist-list ul { margin: 0; padding-left: 16px; }
        .hist-was { color: var(--text-muted, #8693a8); text-decoration: line-through; }
        .hist-small { margin: 4px 0 0; font-size: 12px; color: var(--text-muted, #8693a8); }
        .res-table th {
            text-align: left; padding: 6px 10px; color: var(--text-muted);
            font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
            border-bottom: 1px solid var(--border);
        }
        .res-table td {
            padding: 7px 10px; border-bottom: 1px solid var(--border);
            color: var(--text-secondary); word-break: break-all;
        }
        .res-table tr:last-child td { border-bottom: none; }
        .res-table .val { color: var(--text-primary); font-family: var(--mono); font-size: 12px; }
        .res-table .key { color: var(--text-muted); font-weight: 600; white-space: nowrap; min-width: 120px; }

        /* Code block (raw output) */
        .raw-block {
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px 16px;
            font-family: var(--mono); font-size: 12px; color: var(--text-secondary);
            overflow-x: auto; max-height: 400px; overflow-y: auto; white-space: pre-wrap;
            line-height: 1.5;
        }

        /* Loading spinner */
        .loading { text-align: center; padding: 40px 0; color: var(--text-muted); }
        .loading i { font-size: 24px; color: var(--cyan); margin-bottom: 8px; }
        .loading p { font-size: 13px; margin-top: 8px; }

        /* Error state */
        .error-msg {
            text-align: center; padding: 24px;
            background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.2);
            border-radius: var(--radius-sm); color: var(--red); font-size: 14px;
        }

        /* A probe asked for by a signed-out visitor: probes reach other machines, so they need an account. */
        .signin-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .signin-card > i { font-size: 22px; color: var(--cyan); flex: none; }
        .signin-card .signin-text { flex: 1 1 240px; min-width: 0; }
        .signin-card .signin-text b { display: block; font-size: 15px; margin-bottom: 4px; color: var(--text-primary); }
        .signin-card .signin-text p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--text-secondary, #b0b0b8); }
        .signin-card .btn-go { padding: 10px 22px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--cyan); color: #fff; white-space: nowrap; }
        .signin-card .btn-go:hover { background: #0891b2; color: #fff; }

        /* A tool this server cannot run */
        .tool-unavailable p { font-size: 14px; color: var(--text-secondary, #b0b0b8); margin: 8px 0 12px; line-height: 1.5; }

        /* Pivot link */
        .pivot {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--cyan); font-size: 12px; cursor: pointer; font-weight: 500;
        }
        .pivot:hover { text-decoration: underline; }

        /* ─── Hub: tool grid ─── */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px; margin-top: 20px;
        }
        .tool-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 16px 18px;
            display: flex; align-items: flex-start; gap: 12px;
            transition: all .2s; cursor: pointer; text-decoration: none; color: inherit;
        }
        .tool-card:hover { background: var(--bg-hover); border-color: var(--border-light); transform: translateY(-2px); text-decoration: none; }
        .tool-card .tc-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: rgba(6,182,212,0.1); color: var(--cyan);
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            flex-shrink: 0;
        }
        .tool-card .tc-info h3 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .tool-card .tc-info p { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
        .tool-card .tc-domain { font-size: 11px; color: var(--text-muted); font-family: var(--mono); margin-top: 4px; }

        /* ─── Hub: category groups ─── */
        .cat-group { margin-top: 32px; }
        .cat-group h2 {
            font-size: 16px; font-weight: 700; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px; color: var(--text-primary);
        }
        .cat-group h2 i { color: var(--cyan); font-size: 14px; }

        /* ─── MyIP special card ─── */
        .myip-card {
            background: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(139,92,246,0.06));
            border: 1px solid rgba(6,182,212,0.2);
            border-radius: var(--radius); padding: 24px; text-align: center;
            margin: 20px auto; max-width: 500px;
        }
        .myip-card .ip-display {
            font-size: 1.8rem; font-weight: 800; font-family: var(--mono);
            color: var(--cyan); margin: 12px 0 4px; word-break: break-all;
        }
        .myip-card .ip-meta { font-size: 13px; color: var(--text-secondary); }
        .myip-card .copy-btn {
            margin-top: 10px; padding: 6px 16px; border-radius: 8px;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-secondary); font-size: 12px; font-weight: 500;
            transition: all .15s;
        }
        .myip-card .copy-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* ─── Tabs (for lookup supertool) ─── */
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
        .tab-btn {
            padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted);
            border-bottom: 2px solid transparent; transition: all .15s; white-space: nowrap;
        }
        .tab-btn:hover { color: var(--text-secondary); }
        .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ─── Footer ─── */

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            .hero h1 { font-size: 1.6rem; }
            .hero { padding: 32px 0 16px; }
            .search-bar { flex-direction: column; padding: 8px; }
            .search-bar input { padding: 12px 8px; }
            .search-bar .btn-go { width: 100%; text-align: center; padding: 12px; }
            .tool-grid { grid-template-columns: 1fr; }
            .res-table .key { min-width: 80px; }
        }

        /* ─── Toast ─── */
        .toast-container { position: fixed; top: 60px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary);
            animation: toast-in .2s ease; min-width: 200px; backdrop-filter: blur(12px);
        }
        .toast.info { border-color: rgba(6,182,212,0.3); }
        .toast.error { border-color: rgba(239,68,68,0.3); color: var(--red); }
        @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } }

        /* ─── Floating Animation for Showcase ─── */
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 1; }
            50% { transform: translateY(-8px) scale(1.02); opacity: 1; }
        }

        /* ─── Showcase Grid ─── */
        .showcase-section {
            padding: 32px 0;
            text-align: center;
        }

        .showcase-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .showcase-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .showcase-tool {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 12px;
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.15);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: float 3s ease-in-out infinite;
        }

        .showcase-tool:nth-child(1) { animation-delay: 0s; }
        .showcase-tool:nth-child(2) { animation-delay: 0.15s; }
        .showcase-tool:nth-child(3) { animation-delay: 0.3s; }
        .showcase-tool:nth-child(4) { animation-delay: 0.45s; }
        .showcase-tool:nth-child(5) { animation-delay: 0.6s; }
        .showcase-tool:nth-child(6) { animation-delay: 0.75s; }
        .showcase-tool:nth-child(7) { animation-delay: 0.9s; }
        .showcase-tool:nth-child(8) { animation-delay: 1.05s; }

        .showcase-tool:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.4);
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 12px 24px rgba(6, 182, 212, 0.2);
        }

        .showcase-tool-icon {
            font-size: 24px;
            color: var(--cyan);
            transition: transform 0.3s ease;
        }

        .showcase-tool:hover .showcase-tool-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .showcase-tool-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* ─── Quick Examples ─── */
        .quick-examples {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }

        .examples-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }

        .example-btn {
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        /* ─── Stat Cards ─── */
        .stats-section {
            padding: 24px 0;
            margin-top: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.05), rgba(139, 92, 246, 0.05));
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
            animation: fadeInScale 0.6s ease-out backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0s; }
        .stat-card:nth-child(2) { animation-delay: 0.1s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.3s; }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        /* The tool frame: the brand is the site ("Tools"), not the subdomain's name; the kit's buttons carry the accent. */
        .ov-tool-page .openvibe-navbar .openvibe-navbar-brand .b-core,
        .ov-tool-page .openvibe-navbar .openvibe-navbar-brand .b-dot,
        .ov-tool-page .openvibe-navbar .openvibe-navbar-brand .b-tld { display: none; }
        #options-area .options-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-secondary); }
        #options-area select, #options-area input { min-height: 40px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--border-light); background: var(--bg-input); color: var(--text-primary); font: inherit; }
    </style>

<body>
    <div class="bg-glow"></div>
    <div class="page">
        <!-- Navbar injected by OpenVibeNavbar.init() -->
        <div class="nav-placeholder" id="navbar-mount"></div>

        <!-- ov-frame:start -->
        <!-- Hero -->
        <div class="hero shell" id="hero">
            <div class="hero-icon"><i class="fa-solid fa-network-wired"></i></div>

        <!-- Search -->
        <div class="shell">
            <div class="search-bar" id="search-bar">

            <!-- Showcase Section (hub only) -->
            <div id="showcase-section" style="display:none" class="showcase-section">

                        <button class="example-btn" onclick="quickTry('1.1.1.1', 'ip')"><i class="fa-solid fa-at"></i> Cloudflare IP</button>
                        <button class="example-btn" onclick="quickTry('google.com', 'ssl')"><i class="fa-solid fa-lock"></i> Google SSL</button>
                        <button class="example-btn" onclick="quickTry('github.com', 'dns')"><i class="fa-solid fa-sitemap"></i> GitHub DNS</button>

                <div class="stats-section">

                        </div>
                        <div class="stat-card">
                            <div class="stat-value">0%</div>

                        </div>
                        <div class="stat-card">

                        </div>

            <!-- Tool selector (shown on individual pages) / Tool chips (shown on hub) -->

    <div class="toast-container" id="toasts"></div>

    <!-- Shared OpenVibe Navbar -->
    <script src="/shared/navbar.js"></script>
    <script src="/shared/footer.js"></script>
    <script src="/shared/theme-loader.js" defer></script>
    <script>
    'use strict';

    // ─── Showcase interaction functions ───────────────────
    function quickTry(input, tool) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.value = input;
            setTool(tool);
        }
    }

    function setTool(toolId) {
        if (TOOLS[toolId]) {
            goTool(toolId);
        }
    }

    function buildShowcaseGrid() {
        const showcase = document.getElementById('showcase-grid');
        if (!showcase) return;
        const popular = ['myip', 'dns', 'ssl', 'ping', 'geoip', 'ip', 'rdns', 'headers'];
        showcase.innerHTML = popular.map(id => {
            const t = TOOLS[id];
            return `<div class="showcase-tool" onclick="setTool('${id}')" title="${t.name}">
                <div class="showcase-tool-icon"><i class="fa-solid ${t.icon}"></i></div>
                <div class="showcase-tool-label">${t.name.replace('OpenVibe', '')}</div>
            </div>`;
        }).join('');
    }

    // ═══════════════════════════════════════════════════════════
    // Net.OpenVibe — Client-Side App
    // Detects subdomain to determine active tool, renders UI,
    // calls the tools run API (/api/v1/tools/<id>/run) on openvibe.tools.
    // ═══════════════════════════════════════════════════════════

    const API_BASE = '/api/v1/tools';

    // ── Tool definitions (mirrors server/net/config.js: endpoint and status must agree, which
    //    test/registry-consistency.test.js checks) ──────
    const TOOLS = {
        // Hub
        net:              { name: 'Network Tools',            icon: 'fa-network-wired',     cat: 'hub',   endpoint: null,        placeholder: 'Enter a domain, IP, or URL…' },
        lookup:           { name: 'Domain & IP Lookup',         icon: 'fa-magnifying-glass',  cat: 'hub',   endpoint: '/lookup',   placeholder: 'Domain, IP, or URL — we\'ll look up everything', btnText: 'Lookup All' },
        // IP / Identity
        myip:             { name: 'What Is My IP',           icon: 'fa-location-dot', cat: 'ip',  endpoint: '/myip',     placeholder: null, auto: true },
        ip:               { name: 'IP Address Lookup',             icon: 'fa-at',                cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        ipv4:             { name: 'IPv4 Lookup & CIDR Calculator',           icon: 'fa-hashtag',           cat: 'ip',    endpoint: '/ipv4',     placeholder: 'IPv4 address, CIDR block (e.g. 192.168.1.0/24) or domain' },
        ipv6:             { name: 'IPv6 Lookup',           icon: 'fa-code',              cat: 'ip',    endpoint: '/ipv6',     placeholder: 'IPv6 address or domain' },
        geoip:            { name: 'IP Geolocation',          icon: 'fa-earth-americas',    cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        hostname:         { name: 'Hostname Lookup',       icon: 'fa-server',            cat: 'ip',    endpoint: '/rdns',     placeholder: 'IP address to resolve hostname' },
        isp:              { name: 'ISP Lookup',            icon: 'fa-city',          cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        asn:              { name: 'ASN Lookup',            icon: 'fa-diagram-project',   cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        rdns:             { name: 'Reverse DNS Lookup',     icon: 'fa-rotate-left',       cat: 'ip',    endpoint: '/rdns',     placeholder: 'IP address for reverse DNS' },
        whois:            { name: 'Whois Lookup',          icon: 'fa-address-card',      cat: 'ip',    endpoint: '/rdap',     placeholder: 'Domain or IP' },
        rdap:             { name: 'RDAP Lookup',           icon: 'fa-id-card',           cat: 'ip',    endpoint: '/rdap',     placeholder: 'Domain or IP for RDAP lookup' },
        // DNS
        dns:              { name: 'DNS Lookup',            icon: 'fa-sitemap',           cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain to query' },
        dig:              { name: 'Online dig',            icon: 'fa-terminal',          cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain (dig-style query)',   dnsTypes: true },
        nslookup:         { name: 'NSLookup',       icon: 'fa-magnifying-glass', cat: 'dns', endpoint: '/dns', placeholder: 'Domain for nslookup' },
        dnspropagation:   { name: 'DNS Propagation Checker', icon: 'fa-globe',            cat: 'dns',   endpoint: '/dnsprop',  placeholder: 'Domain to compare across public resolvers', propTypes: true },
        mx:               { name: 'MX Record Lookup',             icon: 'fa-envelope',          cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for MX records',     defaultTypes: 'MX' },
        txt:              { name: 'TXT Record Lookup',            icon: 'fa-file-lines',        cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for TXT records',    defaultTypes: 'TXT' },
        ns:               { name: 'Nameserver Lookup',             icon: 'fa-server',            cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for NS records',     defaultTypes: 'NS' },
        spf:              { name: 'SPF Record Checker',            icon: 'fa-shield-halved',     cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for SPF check',      defaultTypes: 'TXT' },
        dkim:             { name: 'DKIM Record Lookup',           icon: 'fa-key',               cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for DKIM',           defaultTypes: 'TXT' },
        dmarc:            { name: 'DMARC Checker',          icon: 'fa-user-shield',       cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for DMARC',          defaultTypes: 'TXT' },
        // Active diagnostics
        ping:             { name: 'Ping Test (TCP)',           icon: 'fa-satellite-dish',    cat: 'diag',  endpoint: '/ping',     placeholder: 'Host to ping (TCP port 443, from our server)' },
        traceroute:       { name: 'Traceroute',     icon: 'fa-route',             cat: 'diag',  endpoint: '/trace',    placeholder: 'Host to trace (the path from our server)', wait: 'about 10 seconds' },
        mtr:              { name: 'MTR Report',            icon: 'fa-chart-line',        cat: 'diag',  endpoint: '/mtr',      placeholder: 'Host for an MTR report (10 probes a hop, from our server)', wait: 'about 15 seconds' },
        port:             { name: 'Port Checker',      icon: 'fa-door-open',         cat: 'diag',  endpoint: '/port',     placeholder: 'Host to scan ports' },
        headers:          { name: 'HTTP Header Checker',        icon: 'fa-list',              cat: 'diag',  endpoint: '/headers',  placeholder: 'URL or domain' },
        redirects:        { name: 'Redirect Checker',      icon: 'fa-arrow-up-from-bracket',             cat: 'diag',  endpoint: '/redirects', placeholder: 'URL to follow redirects' },
        ssl:              { name: 'SSL Certificate Checker',            icon: 'fa-lock',              cat: 'diag',  endpoint: '/ssl',      placeholder: 'Domain for SSL check' },
        curl:             { name: 'Online curl',           icon: 'fa-download',          cat: 'diag',  endpoint: '/headers',  placeholder: 'URL' },
        httpstatus:       { name: 'HTTP Status Codes',     icon: 'fa-circle-check',      cat: 'diag',  endpoint: '/headers',  placeholder: 'URL to check' },
        latency:          { name: 'TCP Latency Test',        icon: 'fa-gauge-high',        cat: 'diag',  endpoint: '/ping',     placeholder: 'Host (10 timed TCP connections to port 443)', count: 10 },
        // Email & reputation
        blacklist:        { name: 'Blacklist Checker',     icon: 'fa-ban',               cat: 'mail',  endpoint: '/blacklist', placeholder: 'IPv4 address or domain' },
        reputation:       { name: 'Domain Reputation Checker', icon: 'fa-star',          cat: 'mail',  endpoint: '/reputation', placeholder: 'Domain or IPv4 address' },
        smtp:             { name: 'SMTP Server Test',      icon: 'fa-paper-plane',       cat: 'mail',  endpoint: '/smtp',     placeholder: 'Mail server or domain (its MX is used)', smtpPorts: true },
        // Website checks
        uptime:           { name: 'Website Uptime Checker', icon: 'fa-heart-pulse',      cat: 'web',   endpoint: '/uptime',   placeholder: 'URL or domain' },
        robots:           { name: 'Robots.txt Tester',     icon: 'fa-robot',             cat: 'web',   endpoint: '/robots',   placeholder: 'Domain or URL', robotsTest: true },
        sitemap:          { name: 'Sitemap Validator',     icon: 'fa-sitemap',           cat: 'web',   endpoint: '/sitemap',  placeholder: 'Sitemap URL or domain' },
    };

    const CATS = {
        ip: { label: 'IP / Identity / Ownership', icon: 'fa-id-card' },
        dns: { label: 'DNS Tools', icon: 'fa-sitemap' },
        diag: { label: 'Active Diagnostics', icon: 'fa-satellite-dish' },
        mail: { label: 'Email & Reputation', icon: 'fa-envelope' },
        web: { label: 'Website Checks', icon: 'fa-globe' },
    };

    // ── Detect active tool from subdomain ────────────────────
    const host = location.hostname;
    const subdomain = host.replace(/\.openvibe\.tools$/, '');
    // The gateway names the tool in <meta name="ov-tool"> (descriptive hosts, mirrors, custom domains).
    const META_TOOL = (document.querySelector('meta[name="ov-tool"]') || {}).content || '';
    let activeTool = TOOLS[META_TOOL] ? META_TOOL : TOOLS[subdomain] ? subdomain : 'net';
    // Aliases
    if (subdomain === 'network') activeTool = 'net';
    if (subdomain === 'ptr') activeTool = 'rdns';
    if (subdomain === 'tls') activeTool = 'ssl';

    const tool = TOOLS[activeTool] || TOOLS.net;
    const isHub = activeTool === 'net';
    const isLookup = activeTool === 'lookup';

    // ── Set page title + meta ────────────────────────────────
    // The server wrote this page's own title, description and canonical (seo/render). A framed page keeps them;
    // the old script rewrote them, which made every tool subdomain share the hub's title.
    if (!document.querySelector('[data-ov-tool-page]')) {
        document.title = isHub ? 'Net.OpenVibe — Network & Internet Diagnostics' : `${tool.name} — ${tool.placeholder || 'Network Tool'}`;
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.content = document.title;
    }

    // ── Init ─────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        // Shared navbar + footer (openvibe.network)
        try {
            const token = localStorage.getItem('ov_token') || getCookie('ov_token');
            OpenVibeNavbar.init({
                service: 'net', apiBase: 'https://openvibe.network', token,
                history: { type: 'tool', title: isHub ? 'Net.OpenVibe' : tool.name },
                silentLogin: 'https://openvibe.tools/auth/login?silent=1&next={url}',
                ...(document.body.classList.contains('ov-tool-page') ? { brand: { subLabel: 'Tools', name: 'OpenVibe.Tools' } } : {}),
            });
        } catch {}
        try {
            OpenVibeFooter.init({
                service: 'net', variant: isHub ? 'full' : 'compact', mount: '#ov-footer', apiBase: 'https://openvibe.network',
                brandName: document.body.classList.contains('ov-tool-page') ? 'OpenVibe.Tools' : undefined,
                links: [
                    { heading: 'Network tools', items: [
                        { name: 'Domain & IP lookup', url: 'https://lookup.openvibe.tools' },
                        { name: 'DNS lookup', url: 'https://dns.openvibe.tools' },
                        { name: 'Ping', url: 'https://ping.openvibe.tools' },
                        { name: 'SSL checker', url: 'https://ssl.openvibe.tools' },
                        { name: 'Whois', url: 'https://whois.openvibe.tools' },
                        { name: 'HTTP headers', url: 'https://headers.openvibe.tools' },
                    ] },
                    { heading: 'Email & uptime', items: [
                        { name: 'SPF checker', url: 'https://spf.openvibe.tools' },
                        { name: 'DMARC checker', url: 'https://dmarc.openvibe.tools' },
                        { name: 'Blacklist check', url: 'https://blacklist.openvibe.tools' },
                        { name: 'Uptime check', url: 'https://uptime.openvibe.tools' },
                        { name: 'All network tools', url: 'https://net.openvibe.tools' },
                    ] },
                ],
            });
        } catch {}

        setupUI();

        // Show showcase on hub
        if (isHub) {
            document.getElementById('showcase-section').style.display = '';
            buildShowcaseGrid();
            const n = Object.values(TOOLS).filter(t => t.endpoint && !t.unavailable).length;
            document.getElementById('stat-tools').textContent = String(n);
        }

        // The box is a GET form; its submit runs the tool without reloading the page.
        document.querySelectorAll('[data-ov-tool-page] form.ovk-tool-form, form[data-ovk-tool-form]').forEach((form) => {
            if (form.dataset.ovWired) return;
            form.dataset.ovWired = '1';
            form.addEventListener('submit', (e) => { e.preventDefault(); runTool(); });
        });

        // If tool auto-runs (myip), do it immediately
        if (tool.auto) runTool();
        // A Try link or a shared link (?q=, or an older target/domain/ip) fills the box and runs once.
        runFromQuery();
    });

    /** The first value the address names for this tool, from its own input name or an older alias. */
    function queryValue(search) {
        const params = new URLSearchParams(search);
        return params.get('q') || params.get('target') || params.get('domain') || params.get('ip') || '';
    }

    /** Fill the box from ?q= and run it once (a shared link or a Try link opened without JavaScript's form submit). */
    function runFromQuery() {
        const q = queryValue(location.search);
        const input = document.getElementById('search-input');
        if (!q || !input) return false;
        input.value = q;
        runTool();
        return true;
    }

    function getCookie(name) {
        const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return v ? v.pop() : null;
    }

    // ── Setup UI based on active tool ────────────────────────
    function setupUI() {
        const framed = !!document.querySelector('[data-ov-tool-page]');
        const searchInput = document.getElementById('search-input');
        const btnGo = document.getElementById('btn-go');
        const chipsArea = document.getElementById('tool-chips-area');

        // A framed page has its head and box from the server (seo/frame.js): no hero, no chip cloud.
        if (!framed) {
            const hero = document.getElementById('hero');
            if (hero) {
                const heroIcon = hero.querySelector('.hero-icon');
                const heroH1 = hero.querySelector('h1');
                const heroSub = hero.querySelector('.sub');
                if (heroIcon) heroIcon.innerHTML = `<i class="fa-solid ${tool.icon}"></i>`;
                if (isHub) {
                    if (heroH1) heroH1.innerHTML = '<span class="accent">OpenVibe</span>Net';
                    if (heroSub) heroSub.textContent = 'Online network diagnostics — DNS, GeoIP, ping, SSL, Whois, HTTP headers, and more. No login required.';
                } else {
                    if (heroH1) heroH1.innerHTML = tool.name.replace('OpenVibe', '<span class="accent">OpenVibe</span>');
                    if (heroSub) heroSub.textContent = tool.placeholder || '';
                }
            }
            if (tool.placeholder && searchInput) searchInput.placeholder = tool.placeholder;
            if ((tool.auto || tool.unavailable) && document.getElementById('search-bar')) document.getElementById('search-bar').style.display = 'none';
            if (tool.unavailable) {
                const results = document.getElementById('results');
                if (results) {
                    const box = document.createElement('div');
                    box.className = 'card tool-unavailable';
                    box.setAttribute('role', 'status');
                    const head = document.createElement('div');
                    head.className = 'card-head';
                    head.textContent = 'Not available';
                    const p = document.createElement('p');
                    p.textContent = tool.unavailable;
                    box.append(head, p);
                    if (tool.instead && TOOLS[tool.instead]) {
                        const a = document.createElement('a');
                        a.className = 'pivot';
                        a.href = `https://${tool.instead}.openvibe.tools`;
                        a.textContent = `Open the ${TOOLS[tool.instead].name}`;
                        box.append(a);
                    }
                    results.append(box);
                }
            }
            if (tool.btnText && btnGo) btnGo.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> ${tool.btnText}`;
            if (isHub) {
                document.getElementById('hub-directory').style.display = '';
                buildHubDirectory();
                const popular = ['lookup', 'myip', 'dns', 'ping', 'ssl', 'geoip', 'whois', 'headers', 'rdns', 'port'];
                if (chipsArea) chipsArea.innerHTML = `<div class="tool-chips">${popular.map(id => {
                    const t = TOOLS[id];
                    return `<span class="tool-chip" onclick="goTool('${id}')"><i class="fa-solid ${t.icon}"></i> ${t.name.replace('OpenVibe', '')}</span>`;
                }).join('')}</div>`;
            } else if (chipsArea) {
                const related = Object.entries(TOOLS).filter(([, t]) => t.cat === tool.cat && !t.auto && !t.unavailable);
                if (related.length > 1) chipsArea.innerHTML = `<div class="tool-selector">${related.map(([id, t]) => `<button class="ts-btn${id === activeTool ? ' active' : ''}" onclick="goTool('${id}')"><i class="fa-solid ${t.icon}"></i> ${t.name.replace('OpenVibe', '')}</button>`).join('')}</div>`;
            }
        }

        // Tool options (still inside the framed card, under the box): a record type, a port, a robots path, DNS types.
        const opts = document.getElementById('options-area');
        if (opts) {
            if (tool.propTypes) {
                opts.innerHTML = `<div class="options-row"><label for="prop-type">Record type:</label>
                    <select id="prop-type">${['A', 'AAAA', 'CNAME', 'MX', 'NS', 'TXT'].map(t => `<option value="${t}">${t}</option>`).join('')}</select></div>`;
            }
            if (tool.smtpPorts) {
                opts.innerHTML = `<div class="options-row"><label for="smtp-port">Port:</label>
                    <select id="smtp-port"><option value="25">25 (server to server)</option><option value="587">587 (submission)</option></select></div>`;
            }
            if (tool.robotsTest) {
                opts.innerHTML = `<div class="options-row"><label for="robots-path">Test a path (optional):</label>
                    <input id="robots-path" type="text" placeholder="/private/page.html" spellcheck="false" style="min-width:200px">
                    <label for="robots-ua">as</label>
                    <select id="robots-ua"><option value="*">any crawler (*)</option><option>Googlebot</option><option>Bingbot</option><option>GPTBot</option></select></div>`;
            }
            if (tool.dnsTypes) {
                const types = ['A', 'AAAA', 'MX', 'TXT', 'CNAME', 'NS', 'SOA', 'PTR', 'CAA', 'SRV'];
                opts.innerHTML = `<div class="options-row">
                    <label>Record types:</label>
                    <select id="dns-types" multiple style="min-width:200px;min-height:28px">
                        ${types.map(t => `<option value="${t}" ${['A','AAAA','MX','TXT','NS'].includes(t) ? 'selected' : ''}>${t}</option>`).join('')}
                    </select>
                </div>`;
            }
        }
    }

    // ── Hub directory ────────────────────────────────────────
    function buildHubDirectory() {
        const dir = document.getElementById('hub-directory');
        let html = '';
        for (const [catId, cat] of Object.entries(CATS)) {
            const tools = Object.entries(TOOLS).filter(([, t]) => t.cat === catId);
            html += `<div class="cat-group">
                <h2><i class="fa-solid ${cat.icon}"></i> ${cat.label}</h2>
                <div class="tool-grid">${tools.map(([id, t]) => `
                    <a class="tool-card" href="https://${id}.openvibe.tools" onclick="goTool('${id}');return false;">
                        <div class="tc-icon"><i class="fa-solid ${t.icon}"></i></div>
                        <div class="tc-info">
                            <h3>${t.name}</h3>
                            <p>${t.unavailable ? 'Not available' : (t.placeholder || '')}</p>
                            <div class="tc-domain">${id}.openvibe.tools</div>
                        </div>
                    </a>
                `).join('')}</div>
            </div>`;
        }
        dir.innerHTML = html;
    }

    // ── Navigate to a tool ───────────────────────────────────
    function goTool(id) {
        const input = document.getElementById('search-input');
        const q = input ? input.value.trim() : '';
        const url = `https://${id}.openvibe.tools${q ? '?q=' + encodeURIComponent(q) : ''}`;
        location.href = url;
    }

    // The message of a run that did not succeed (a refusal problem, or the tool's own error).
    function runError(body) {
        const e = body && body.error;
        return (e && (e.detail || e.title || e.message)) || (body && (body.detail || body.title)) || 'Lookup failed';
    }

    // ── The run input, from the tool's descriptor ────────────
    // Every net tool's input schema has additionalProperties: false, so a field it does not declare
    // (types on mx., count on latency.) would refuse the run: send only what the schema lists.
    const schemas = new Map();
    function inputSchema(id) {
        if (!schemas.has(id)) {
            schemas.set(id, fetch(`${API_BASE}/${encodeURIComponent(id)}/schema`, { credentials: 'same-origin' })
                .then(r => (r.ok ? r.json() : null))
                .then(s => (s && s.$defs && s.$defs.input) || null)
                .catch(() => null)
                .then(s => { if (!s) schemas.delete(id); return s; }));
        }
        return schemas.get(id);
    }
    /** What the page collected for `tool`, as run input fields (before the schema filter). */
    function runFields(tool, ui) {
        const f = {};
        if (ui.target) f.target = ui.target;
        if (ui.types && ui.types.length) f.types = ui.types;
        if (ui.selector) f.selector = ui.selector;
        if (tool.count) f.count = tool.count;
        if (ui.propType) f.type = ui.propType;
        if (ui.smtpPort) f.port = parseInt(ui.smtpPort, 10);
        const path = String(ui.robotsPath || '').trim();
        if (path) { f.path = path; f.ua = ui.robotsUa; }
        return f;
    }
    /** The fields `schema` declares (no schema, say the descriptor could not be fetched: the target only). */
    function runInput(schema, fields) {
        const props = (schema && schema.properties) || { target: {} };
        const input = {};
        for (const [k, v] of Object.entries(fields)) if (v !== undefined && Object.prototype.hasOwnProperty.call(props, k)) input[k] = v;
        return input;
    }

    // ── Run the active tool ──────────────────────────────────
    async function runTool() {
        const input = document.getElementById('search-input');
        const target = input ? input.value.trim() : '';
        const resultsEl = document.querySelector('.ovk-tool-out');
        if (!resultsEl) return;

        // Hub: if user types something, redirect to lookup
        if (isHub && target) {
            location.href = `https://lookup.openvibe.tools?q=${encodeURIComponent(target)}`;
            return;
        }

        if (!tool.endpoint || tool.unavailable) return;
        if (!target && !tool.auto) { toast('Please enter a domain, IP, or URL', 'error'); return; }

        // Show loading (in the frame's answer slot)
        resultsEl.innerHTML = `<section class="ovk-answer" aria-live="polite"><div class="ovk-answer-head"><h2>Running ${esc(tool.name)}…</h2></div><div class="ovk-answer-body"><p class="ovk-muted">${esc(tool.wait ? `This takes ${tool.wait}.` : 'Asking OpenVibe\'s server.')}</p></div></section>`;

        try {
            // The tool's run API (plan T8, Phase 1): the fields the page collected, kept only where the
            // tool's own input schema (its descriptor, GET /api/v1/tools/<id>/schema) declares them. The
            // descriptor adds the rest itself: MX/TXT/NS types, the _dmarc. and <selector>._domainkey.
            // targets, the latency count.
            let selector;
            if (activeTool === 'dkim' && target) selector = prompt('DKIM selector (e.g., "default", "google", "s1"):', 'default') || 'default';
            const fields = runFields(tool, {
                target,
                types: tool.dnsTypes && document.getElementById('dns-types') ? [...document.getElementById('dns-types').selectedOptions].map(o => o.value) : undefined,
                selector,
                propType: tool.propTypes ? document.getElementById('prop-type').value : undefined,
                smtpPort: tool.smtpPorts ? document.getElementById('smtp-port').value : undefined,
                robotsPath: tool.robotsTest ? document.getElementById('robots-path').value : undefined,
                robotsUa: tool.robotsTest ? document.getElementById('robots-ua').value : undefined,
            });
            const input = runInput(await inputSchema(activeTool), fields);

            const token = localStorage.getItem('ov_token') || getCookie('ov_token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const r = await fetch(`${API_BASE}/${activeTool}/run`, { method: 'POST', headers, credentials: 'same-origin', body: JSON.stringify({ input }) });
            if (r.status === 401) return renderSignIn(resultsEl);
            const body = await r.json();
            if (body.state !== 'succeeded' || !body.result) throw new Error(runError(body));
            const data = { ok: true, ...body.result.data };

            renderResults(data);
        } catch (err) {
            showAnswer({ title: 'Lookup failed', badge: { text: 'Error', tone: 'bad' }, tone: 'bad', rows: [], body: `<p>${esc(err.message)}</p>` });
        }
    }

    // A probe (port, ping, latency, traceroute, mtr) sends traffic to the target, so the run API asks for an account
    // (401); an expired sign-in answers 401 too, and the same card signs the visitor back in.
    function renderSignIn() {
        const next = encodeURIComponent(location.href);
        const kit = window.OpenVibeKit;
        showAnswer({
            title: 'Sign in to run this probe', badge: { text: 'Account needed', tone: 'warn' },
            rows: [], body: `<p>Probes like ping, port checks and traceroute send traffic to the target itself, so they run under an OpenVibe account. It is free, and lookups like DNS still work without one.</p>`,
            next: kit ? [kit.button({ href: `https://openvibe.tools/auth/login?next=${next}`, label: 'Sign in', icon: 'user' })] : [],
        });
    }

    // ── Render results based on tool type ────────────────────
    function renderResults(data) {
        if (activeTool === 'myip') return answerMyIP(data);
        if (activeTool === 'lookup' || isLookup) return answerLookup(data);
        if (tool.endpoint === '/ip') return answerIP(data);
        if (tool.endpoint === '/ipv4') return answerIPv4(data);
        if (tool.endpoint === '/ipv6') return answerIPv6(data);
        if (tool.endpoint === '/dns') return answerDNS(data);
        if (tool.endpoint === '/rdns') return answerRDNS(data);
        if (tool.endpoint === '/rdap') return answerRDAP(data);
        if (tool.endpoint === '/ssl') return answerSSL(data);
        if (tool.endpoint === '/headers') return answerHeaders(data);
        if (tool.endpoint === '/redirects') return answerRedirects(data);
        if (tool.endpoint === '/port') return answerPort(data);
        if (tool.endpoint === '/ping') return answerPing(data);
        if (tool.endpoint === '/trace') return answerTrace(data, false);
        if (tool.endpoint === '/mtr') return answerTrace(data, true);
        if (tool.endpoint === '/dnsprop') return answerDnsProp(data);
        if (tool.endpoint === '/blacklist') return answerBlacklist(data);
        if (tool.endpoint === '/reputation') return answerReputation(data);
        if (tool.endpoint === '/smtp') return answerSMTP(data);
        if (tool.endpoint === '/uptime') return answerUptime(data);
        if (tool.endpoint === '/robots') return answerRobots(data);
        if (tool.endpoint === '/sitemap') return answerSitemap(data);
        // Fallback: raw JSON
        return answerRaw(data);
    }

    // ── The answer, in the kit's tool frame (.ovk-tool-out) ──
    // Every lookup now answers as labelled rows with the fact that matters marked, the detail in a kit.table
    // and the untouched JSON in a closed "Raw" fold. The next step links to a sibling for the same input.
    const ANSWER_ID = 'ov-tool-answer';
    const K = () => window.OpenVibeKit;
    const fmtDate = (v) => {
        if (!v) return '';
        const d = new Date(v);
        return Number.isFinite(d.getTime()) ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : String(v);
    };
    // "in 10 months", "1 year ago": the note on a date row.
    function relTime(v) {
        const t = Date.parse(v);
        if (!Number.isFinite(t)) return '';
        const days = Math.round((t - Date.now()) / 86400000);
        const n = Math.abs(days);
        const word = (unit, one) => `${n} ${one || unit}${n === 1 ? '' : 's'}`;
        if (days >= 0) {
            if (n < 1) return 'today';
            if (n < 60) return `in ${word('day')}`;
            const months = Math.round(n / 30.44);
            return `in ${months} month${months === 1 ? '' : 's'}`;
        }
        if (n < 2) return 'yesterday';
        if (n < 60) return `${word('day')} ago`;
        const months = Math.round(n / 30.44);
        return `${months} month${months === 1 ? '' : 's'} ago`;
    }
    const lineValue = (arr) => ({ html: (arr || []).filter((x) => x != null && x !== '').map((x) => esc(String(x))).join('<br>') });
    function rawFold(data) {
        const kit = K();
        return kit.fold({ title: 'Raw', body: kit.snippet({ code: JSON.stringify(data, null, 2) }) });
    }
    function nextTool(id, label, value) {
        return K().button({ href: `https://${id}.openvibe.tools/?q=${encodeURIComponent(value)}`, label, icon: 'chevron', kind: 'quiet', small: true });
    }
    function watchNext(value) {
        if (!/^https?:\/\//i.test(String(value || ''))) return '';
        return K().button({ href: `https://openvibe.watch/watches/new?template=page&url=${encodeURIComponent(value)}`, label: 'Watch for changes', icon: 'bell', kind: 'quiet', small: true });
    }
    function answerTable(columns, rows, label) { return K().table({ columns, rows, label }); }
    function showAnswer(o) {
        const out = document.querySelector('.ovk-tool-out');
        if (!out) return;
        const kit = K();
        if (!kit) {
            out.innerHTML = `<div class="card"><pre class="raw-block">${esc(JSON.stringify(o, null, 2))}</pre></div>`;
            return;
        }
        const actions = [
            kit.iconButton({ type: 'button', icon: 'copy', label: 'Copy result', attrs: { 'data-ovk-copy': `#${ANSWER_ID}` } }),
            kit.iconButton({ href: location.href, icon: 'link', label: 'Copy link', attrs: { 'data-ovk-share': 'Copy link' } }),
            ...(o.actions || []),
        ];
        out.innerHTML = kit.answer({ id: ANSWER_ID, title: o.title || '', badge: o.badge || null, rows: o.rows || [], body: o.body || '', next: o.next || [], tone: o.tone || '', actions });
        if (window.OpenVibeKitWeb) OpenVibeKitWeb.enhance(out);
        if (window.OpenVibeKitData) OpenVibeKitData.enhance(out);
    }
    function answerRaw(data) {
        showAnswer({ title: 'Lookup result', badge: { text: 'Raw', tone: 'ok' }, rows: [], body: rawFold(data) });
    }

    function answerMyIP(data) {
        showAnswer({
            title: data.ip, badge: { text: 'Your public IP', tone: 'ok' },
            rows: [['IP address', data.ip], ['Version', data.version ? `IPv${data.version}` : '']],
            next: [nextTool('geoip', 'Where is it?', data.ip), nextTool('rdns', 'Reverse DNS', data.ip), nextTool('lookup', 'Full lookup', data.ip)],
            body: rawFold(data),
        });
    }

    function answerIP(data) {
        const g = data.geo || {}, n = data.network || {};
        showAnswer({
            title: data.ip, badge: g.country ? { text: g.countryCode || g.country, tone: 'ok' } : null,
            rows: [
                ['IP address', data.ip], ['Hostname', data.hostname], ['Reverse DNS', data.reverse],
                ['Country', g.country ? `${g.country}${g.countryCode ? ` (${g.countryCode})` : ''}` : ''],
                ['Region', g.region], ['City', g.city], ['Timezone', g.timezone],
                ['Coordinates', g.lat != null ? `${g.lat}, ${g.lon}` : ''],
                ['ISP', n.isp], ['Organisation', n.org], ['AS', n.as], ['AS name', n.asname],
            ],
            next: [nextTool('rdns', 'Reverse DNS', data.ip), nextTool('whois', 'Whois', data.ip), nextTool('lookup', 'Full lookup', data.ip)],
            body: rawFold(data),
        });
    }

    function answerIPv4(data) {
        const v = data.ipv4 || {}, c = data.cidr;
        const rows = [['Address', data.ip], ['Class', v.class], ['Type', v.type], ['Public', v.isPublic == null ? '' : (v.isPublic ? 'Yes' : 'No')]];
        if (c && c.prefix < 32) rows.push(['Block', c.cidr], ['Network', c.network], ['Broadcast', c.broadcast], ['Netmask', c.netmask], ['Wildcard', c.wildcard], ['Usable hosts', `${c.firstUsable} – ${c.lastUsable}`], ['Addresses', `${Number(c.total).toLocaleString('en-US')} total, ${Number(c.usable).toLocaleString('en-US')} usable`]);
        if (data.geo) rows.push(['Location', [data.geo.city, data.geo.country].filter(Boolean).join(', ')], ['Organisation', (data.network || {}).org || (data.network || {}).isp]);
        showAnswer({ title: data.ip, badge: { text: v.isPublic ? 'Public' : 'Reserved', tone: v.isPublic ? 'ok' : 'warn' }, rows, next: [nextTool('ip', 'IP lookup', data.ip), nextTool('lookup', 'Full lookup', data.ip)], body: (data.note ? `<p class="ovk-muted">${esc(data.note)}</p>` : '') + rawFold(data) });
    }

    function answerIPv6(data) {
        const v = data.ipv6 || {}, nw = data.network || {};
        showAnswer({
            title: data.ip, badge: v.type ? { text: v.type, tone: v.type === 'Global unicast' ? 'ok' : 'warn' } : null,
            rows: [['Compressed', v.compressed], ['Expanded', v.expanded], ['Scope', v.scope], ['Range', v.prefix], ['Reverse DNS', v.ptr || 'none found'], ['Network', nw.org || nw.isp], ['AS', nw.as], ['Location', data.geo ? [data.geo.city, data.geo.country].filter(Boolean).join(', ') : '']],
            next: [nextTool('rdns', 'Reverse DNS', data.ip), nextTool('ip', 'IPv4 lookup', data.ip)],
            body: rawFold(data),
        });
    }

    function answerRDNS(data) {
        showAnswer({
            title: data.ip, badge: data.ptr ? { text: 'PTR found', tone: 'ok' } : { text: 'No PTR', tone: 'warn' },
            rows: [['IP address', data.ip], ['PTR / hostname', (data.hostnames || []).length ? lineValue(data.hostnames) : 'none found']],
            next: [nextTool('ip', 'IP lookup', data.ip), nextTool('whois', 'Whois', data.ip)],
            body: rawFold(data),
        });
    }

    function answerLookup(data) {
        const ip = data.ip || {}, dns = data.dns || {}, rdap = data.rdap || {}, ssl = data.ssl || {}, hd = data.headers || {};
        const dnsCount = Object.values(dns.records || {}).reduce((n, r) => n + (Array.isArray(r) ? r.length : 0), 0);
        const s = rdap.summary || {};
        showAnswer({
            title: 'Domain & IP lookup', badge: { text: 'All-in-one', tone: 'ok' },
            rows: [
                ['Target', data.target],
                ['IP address', ip.ip], ['Location', ip.geo ? [ip.geo.city, ip.geo.country].filter(Boolean).join(', ') : ''], ['Organisation', (ip.network || {}).org || (ip.network || {}).isp],
                ['DNS', dnsCount ? `${dnsCount} records` : 'none found'],
                ['Registration', (s.status || []).join(', ') || rdap.error || ''],
                ['Certificate', ssl.certificate ? `${fmtDate(ssl.certificate.validTo)}${ssl.certificate.daysLeft != null ? ` · ${ssl.certificate.daysLeft} days left` : ''}` : ''],
                ['HTTP', hd.status ? `${hd.status} ${hd.statusText || ''}` : ''],
            ],
            next: [nextTool('dns', 'DNS records', data.target), nextTool('whois', 'Whois', data.target), nextTool('ssl', 'SSL certificate', data.target)],
            body: rawFold(data),
        });
    }

    function answerRDAP(data) {
        const s = data.summary || {}, ev = {};
        for (const e of s.events || []) ev[e.action] = e.date;
        const registrar = (s.entities || []).find((e) => (e.roles || []).includes('registrar'));
        const created = ev.registration, expires = ev.expiration;
        const rows = [
            ['Registrar', registrar ? registrar.name : ''], ['Created', fmtDate(created), created ? relTime(created) : ''],
            ['Expires', fmtDate(expires), expires ? { text: relTime(expires), tone: 'warn' } : ''],
            ['Updated', fmtDate(ev['last changed'])], ['Name servers', s.nameservers && s.nameservers.length ? lineValue(s.nameservers) : ''],
            ['Status', (s.status || []).join(', ')], ['Whois server', s.port43],
        ];
        showAnswer({
            title: data.type === 'ip' ? 'IP registration' : 'Registration record', badge: { text: data.type === 'ip' ? 'IP' : 'Registered', tone: 'ok' },
            rows: [[data.type === 'ip' ? 'IP address' : 'Domain', data.target], ...rows],
            next: [nextTool('dns', 'DNS records', data.target), nextTool('ssl', 'SSL certificate', data.target), nextTool('lookup', 'Full lookup', data.target)],
            body: rawFold(data),
        });
    }

    function answerDNS(data) {
        const records = data.records || {};
        const badgeText = ({ mx: 'MX', txt: 'TXT', ns: 'NS', spf: 'SPF', dkim: 'DKIM', dmarc: 'DMARC' })[activeTool] || 'DNS';
        const one = (r) => {
            if (r == null) return '';
            if (typeof r === 'string') return r;
            if (Array.isArray(r)) return r.join('');
            if (r.exchange) return `${r.priority} ${r.exchange}`;
            if (r.data) return r.data;
            if (r.nsname) return `${r.nsname} serial ${r.serial}`;
            return JSON.stringify(r);
        };
        const rows = [];
        for (const [type, recs] of Object.entries(records)) {
            if (recs && recs.error) { rows.push([`${type} records`, 'none found', { text: recs.error, tone: 'warn' }]); continue; }
            const list = Array.isArray(recs) ? recs : (recs && typeof recs === 'object' ? [recs] : []);
            if (!list.length) { rows.push([`${type} records`, 'none found', { text: 'no answer', tone: 'warn' }]); continue; }
            const vals = list.map(one).filter(Boolean);
            rows.push([`${type} records`, vals.length === 1 ? vals[0] : lineValue(vals)]);
        }
        if (!rows.length) rows.push(['Records', 'none found', { text: 'no answer', tone: 'warn' }]);
        showAnswer({
            title: `${badgeText} records`, badge: { text: badgeText, tone: 'ok' },
            rows: [['Domain', data.target], ...rows], next: [nextTool('whois', 'Whois', data.target), nextTool('ssl', 'SSL certificate', data.target), nextTool('lookup', 'Full lookup', data.target)],
            body: `<p class="ovk-muted">${data.server && data.server !== 'system' ? `Asked ${esc(data.server)}.` : 'Asked the system resolver.'}</p>` + rawFold(data),
        });
    }

    function answerDnsProp(data) {
        const list = data.resolvers || [];
        const rows = [['Answered', `${data.answered} of ${list.length}`], ['Resolvers agree', data.agree ? 'Yes' : 'No']];
        if (data.majority && data.majority.answers) rows.push(['Most say', lineValue(data.majority.answers)]);
        const table = answerTable([{ key: 'name', label: 'Resolver', primary: true }, { key: 'answers', label: 'Answer' }, { key: 'status', label: 'Status' }, { key: 'ms', label: 'Time', num: true }],
            list.map((r) => ({ name: r.name || r.ip, answers: r.status === 'ok' ? (r.answers || []).join(', ') : '', status: r.status === 'ok' ? (r.differs ? 'differs' : 'ok') : r.status, ms: r.ms })), 'Public resolvers');
        showAnswer({ title: `${data.target} ${data.type || ''}`.trim(), badge: { text: data.agree ? 'All agree' : 'Resolvers disagree', tone: data.agree ? 'ok' : 'warn' }, rows, body: table + rawFold(data) });
    }

    function answerSSL(data) {
        const c = data.certificate || {};
        const days = c.daysLeft;
        showAnswer({
            title: 'Certificate', badge: { text: c.isExpired ? 'Expired' : c.isExpiringSoon ? 'Expires soon' : 'Valid', tone: c.isExpired ? 'bad' : c.isExpiringSoon ? 'warn' : 'ok' },
            rows: [['Domain', data.target], ['Subject', c.subject && (c.subject.CN || c.subject.O)], ['Issuer', c.issuer && (c.issuer.CN || c.issuer.O)], ['Valid until', fmtDate(c.validTo), c.validTo ? { text: relTime(c.validTo), tone: 'warn' } : ''], ['Days left', days != null ? String(days) : ''], ['Protocol', data.protocol], ['Port', data.port], ['Chain', (data.chain || []).length ? `${data.chain.length} certificates` : '']],
            next: [nextTool('whois', 'Whois', data.target), nextTool('dns', 'DNS records', data.target), watchNext(`https://${data.target}`)],
            body: ((data.chain || []).length ? answerTable([{ key: 'subject', label: 'Subject', primary: true }, { key: 'issuer', label: 'Issuer' }, { key: 'validTo', label: 'Valid to' }], data.chain.map((x) => ({ subject: x.subject, issuer: x.issuer, validTo: fmtDate(x.validTo) })), 'Certificate chain') : '') + rawFold(data),
        });
    }

    function answerHeaders(data) {
        const sec = data.security || {};
        const hd = data.headers || {};
        const yes = (v) => v ? 'present' : 'missing';
        const secTable = answerTable([{ key: 'name', label: 'Security header', primary: true }, { key: 'state', label: 'State' }], [
            { name: 'Strict-Transport-Security', state: yes(sec.hasHSTS) }, { name: 'Content-Security-Policy', state: yes(sec.hasCSP) },
            { name: 'X-Content-Type-Options', state: yes(sec.hasXCTO) }, { name: 'X-Frame-Options', state: yes(sec.hasXFO) },
            { name: 'Referrer-Policy', state: yes(sec.hasRP) }, { name: 'Permissions-Policy', state: yes(sec.hasPermissions) },
        ], 'Security headers');
        const hdTable = answerTable([{ key: 'name', label: 'Header', primary: true }, { key: 'value', label: 'Value' }], Object.entries(hd).map(([k, v]) => ({ name: k, value: String(v) })), 'Response headers');
        showAnswer({
            title: 'HTTP response', badge: { text: `HTTP ${data.status}`, tone: data.status < 400 ? 'ok' : 'bad' },
            rows: [['URL', data.url || data.target], ['Status', `${data.status} ${data.statusText || ''}`.trim()], ['Server', data.server], ['Content type', data.contentType], ['Security score', data.securityScore], ['Time', data.timing ? `${data.timing.ms} ms` : '']],
            next: [watchNext(data.url || data.target), nextTool('ssl', 'SSL certificate', data.url || data.target), nextTool('redirects', 'Redirects', data.url || data.target)],
            body: secTable + hdTable + rawFold(data),
        });
    }

    function answerRedirects(data) {
        const chain = data.chain || [];
        const table = answerTable([{ key: 'n', label: '#', primary: true }, { key: 'url', label: 'URL' }, { key: 'status', label: 'Status' }, { key: 'ms', label: 'Time', num: true }], chain.map((h, i) => ({ n: i + 1, url: h.url || h.error || '', status: h.status == null ? (h.refused ? 'refused' : 'error') : h.status, ms: h.ms })), 'Redirect chain');
        showAnswer({
            title: 'Redirect chain', badge: { text: `${chain.length} hop${chain.length === 1 ? '' : 's'}`, tone: 'ok' },
            rows: [['Original URL', data.originalUrl || data.target], ['Final URL', data.finalUrl], ['Hops', String(chain.length)], ['Stopped', data.stopped]],
            next: [watchNext(data.originalUrl || data.target), nextTool('headers', 'HTTP headers', data.finalUrl || data.originalUrl || data.target)],
            body: table + rawFold(data),
        });
    }

    function answerPort(data) {
        const ports = data.ports || [];
        const open = ports.filter((p) => p.status === 'open').length;
        const table = answerTable([{ key: 'port', label: 'Port', primary: true, num: true }, { key: 'status', label: 'Status' }, { key: 'ms', label: 'Time', num: true }], ports.map((p) => ({ port: p.port, status: p.status, ms: p.ms })), 'Ports');
        showAnswer({
            title: 'Port check', badge: { text: `${open} open`, tone: open ? 'ok' : 'warn' },
            rows: [['Target', `${data.target} (${data.ip})`], ['Open ports', open ? ports.filter((p) => p.status === 'open').map((p) => p.port).join(', ') : 'none found'], ['Closed or filtered', String(ports.length - open)]],
            next: [nextTool('ping', 'Ping', data.target), nextTool('headers', 'HTTP headers', data.target)],
            body: table + rawFold(data),
        });
    }

    function answerPing(data) {
        const s = data.stats || {};
        const table = answerTable([{ key: 'seq', label: 'Attempt', primary: true, num: true }, { key: 'status', label: 'Status' }, { key: 'ms', label: 'Time', num: true }], (data.results || []).map((r) => ({ seq: r.seq, status: r.status, ms: r.ms })), 'Attempts');
        showAnswer({
            title: 'Ping test', badge: { text: s.loss ? `${s.loss}% loss` : 'Reachable', tone: s.loss ? 'warn' : 'ok' },
            rows: [['Target', `${data.target} (${data.ip})`], ['Average', s.avg != null ? `${s.avg} ms` : ''], ['Best', s.min != null ? `${s.min} ms` : ''], ['Worst', s.max != null ? `${s.max} ms` : ''], ['Loss', s.loss != null ? `${s.loss}%` : '']],
            next: [nextTool('traceroute', 'Traceroute', data.target), nextTool('port', 'Port checker', data.target)],
            body: table + rawFold(data),
        });
    }

    function answerTrace(data, full) {
        const hops = data.hops || [];
        const cols = [{ key: 'hop', label: '#', primary: true, num: true }, { key: 'host', label: 'Host' }, { key: 'asn', label: 'Network' }, { key: 'loss', label: 'Loss', num: true }, { key: 'best', label: 'Best', num: true }, { key: 'avg', label: 'Avg', num: true }, { key: 'worst', label: 'Worst', num: true }];
        const table = answerTable(cols, hops.map((h) => ({ hop: h.hop, host: h.host ? `${h.host}${h.ip ? ` (${h.ip})` : ''}` : (h.ip || 'no reply'), asn: h.asn || '', loss: h.loss == null ? '' : `${h.loss}%`, best: h.best == null ? '' : `${h.best}ms`, avg: h.avg == null ? '' : `${h.avg}ms`, worst: h.worst == null ? '' : `${h.worst}ms` })), full ? 'MTR report' : 'Route');
        showAnswer({
            title: full ? 'MTR report' : 'Route', badge: { text: data.reached ? 'Reached' : 'Not reached', tone: data.reached ? 'ok' : 'warn' },
            rows: [['Target', `${data.target} (${data.ip})`], ['Hops', String(hops.length)], ['Probes a hop', data.probes != null ? String(data.probes) : ''], ['Family', data.family ? `IPv${data.family}` : '']],
            next: [nextTool('ping', 'Ping', data.target), nextTool('mtr', 'MTR report', data.target)],
            body: table + `<p class="ovk-muted">Probes are ICMP echo from OpenVibe's server. A router that stays quiet shows as no reply; loss at one hop that does not carry on is usually that router rate-limiting replies.</p>` + rawFold(data),
        });
    }

    function answerBlacklist(data) {
        const lists = data.lists || [];
        const table = answerTable([{ key: 'name', label: 'List', primary: true }, { key: 'zone', label: 'Zone' }, { key: 'result', label: 'Result' }], lists.map((l) => ({ name: l.name, zone: l.zone, result: l.listed === true ? 'listed' : l.listed === false ? 'not listed' : 'unknown' })), 'Blacklists');
        showAnswer({
            title: 'Blacklist check', badge: { text: data.listedCount ? `Listed on ${data.listedCount}` : 'Not listed', tone: data.listedCount ? 'bad' : 'ok' },
            rows: [['Target', data.domain || data.ip || data.target], ['Listed', String(data.listedCount || 0)], ['Clean', String(data.cleanCount || 0)], ['Could not check', String(data.unknownCount || 0)]],
            next: [nextTool('reputation', 'Reputation', data.domain || data.target), nextTool('dns', 'DNS records', data.domain || data.target)],
            body: table + rawFold(data),
        });
    }

    function answerReputation(data) {
        const findings = data.findings || [];
        const table = answerTable([{ key: 'check', label: 'Check', primary: true }, { key: 'status', label: 'Result' }, { key: 'detail', label: 'Finding' }, { key: 'cost', label: 'Cost', num: true }], findings.map((f) => ({ check: f.check, status: f.status, detail: f.detail, cost: f.cost ? `−${f.cost}` : '' })), 'Signals');
        showAnswer({
            title: 'Reputation', badge: { text: `${data.score} / 100 · ${data.grade}`, tone: data.grade === 'good' ? 'ok' : data.grade === 'fair' ? 'warn' : 'bad' },
            rows: [['Target', data.domain || data.target], ['Score', `${data.score} / 100`], ['Grade', data.grade]],
            next: [nextTool('blacklist', 'Blacklist check', data.domain || data.target), nextTool('spf', 'SPF record', data.domain || data.target)],
            body: table + rawFold(data),
        });
    }

    function answerSMTP(data) {
        const st = data.starttls || {}, c = st.certificate || {};
        const ext = st.extensions || (data.ehlo && data.ehlo.extensions) || [];
        showAnswer({
            title: `${data.host || data.target}:${data.port}`, badge: { text: data.connected ? 'Connected' : 'No connection', tone: data.connected ? 'ok' : 'bad' },
            rows: [['Host', data.host], ['IP', data.ip], ['Port', data.port], ['Greeting', data.banner ? `${data.banner.code} ${data.banner.text}` : ''], ['STARTTLS', st.ok ? `${st.protocol || 'yes'}` : st.offered ? 'offered but failed' : 'not offered'], ['Certificate', c.subject || ''], ['Trusted chain', c.trusted == null ? '' : c.trusted ? 'Yes' : 'No'], ['Name matches', c.hostnameMatch == null ? '' : c.hostnameMatch ? 'Yes' : 'No'], ['Error', data.error]],
            next: [nextTool('mx', 'MX records', data.target), nextTool('spf', 'SPF record', data.target)],
            body: (ext.length ? `<p class="ovk-muted">Extensions: ${ext.map(esc).join(', ')}</p>` : '') + rawFold(data),
        });
    }

    function answerUptime(data) {
        showAnswer({
            title: 'Uptime check', badge: { text: data.state === 'up' ? 'Up' : 'Down', tone: data.state === 'up' ? 'ok' : 'bad' },
            rows: [['URL', data.url], ['State', data.state], ['HTTP status', data.status != null ? String(data.status) : ''], ['Answer time', data.ms != null ? `${data.ms} ms` : ''], ['Final URL', data.finalUrl && data.finalUrl !== data.url ? data.finalUrl : ''], ['Redirects', data.redirects != null ? String(data.redirects) : ''], ['Error', data.error], ['Checked at', data.checkedAt ? fmtDate(data.checkedAt) : '']],
            next: [watchNext(data.url), nextTool('headers', 'HTTP headers', data.url), nextTool('ssl', 'SSL certificate', data.url)],
            body: rawFold(data),
        });
    }

    function answerRobots(data) {
        const groups = data.groups || [];
        const table = groups.length ? answerTable([{ key: 'agents', label: 'User-agent', primary: true }, { key: 'rules', label: 'Rules' }], groups.map((g) => ({ agents: (g.agents || []).join(', '), rules: (g.rules || []).map((r) => `${r.type}: ${r.path || ''}`).join(' · ') || 'none' })), 'Rules') : '';
        const warn = (data.warnings || []).map((w) => `<p><span class="ovk-pill ovk-pill--warn">${w.line ? `line ${w.line}` : 'warning'}</span> ${esc(w.text)}</p>`).join('');
        showAnswer({
            title: 'robots.txt', badge: { text: data.found ? `HTTP ${data.status}` : 'Not found', tone: data.found ? 'ok' : 'warn' },
            rows: [['URL', data.url], ['Verdict', data.verdict], ['Found', data.found ? 'Yes' : 'No'], ['Final URL', data.finalUrl && data.finalUrl !== data.url ? data.finalUrl : ''], ['Sitemaps', (data.sitemaps || []).length ? lineValue(data.sitemaps) : '']],
            next: [nextTool('sitemap', 'Sitemap validator', data.url), watchNext(data.url)],
            body: table + warn + rawFold(data),
        });
    }

    function answerSitemap(data) {
        const issues = data.issues || [];
        const table = issues.length ? answerTable([{ key: 'level', label: 'Level', primary: true }, { key: 'message', label: 'Problem' }], issues.map((i) => ({ level: i.level, message: `${i.message}${i.count > 1 ? ` (${i.count}×)` : ''}` })), 'Problems') : '';
        const sample = (data.sample || []).length ? answerTable([{ key: 'loc', label: 'URL', primary: true }, { key: 'lastmod', label: 'Last modified' }], (data.sample || []).map((u) => ({ loc: u.loc, lastmod: u.lastmod || '' })), 'First entries') : '';
        showAnswer({
            title: 'Sitemap', badge: { text: data.valid ? 'Valid' : 'Problems', tone: data.valid ? 'ok' : 'bad' },
            rows: [['URL', data.url], ['Kind', data.kind === 'index' ? 'Sitemap index' : data.kind], ['URLs', data.count != null ? String(data.count) : ''], ['HTTP status', data.status != null ? String(data.status) : ''], ['Final URL', data.finalUrl && data.finalUrl !== data.url ? data.finalUrl : '']],
            next: [nextTool('robots', 'robots.txt', data.url), watchNext(data.url)],
            body: table + sample + rawFold(data),
        });
    }
    // ── Utility functions ────────────────────────────────────
    function esc(s) {
        if (s == null) return '';
        const d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
    }

    function toast(msg, type = 'info') {
        const container = document.getElementById('toasts');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }
    </script>
  <script src="https://openvibe.live/live-notify.js" async></script>
</body>
</html>
