    <div class="toast-container" id="toasts"></div>

    <!-- Shared OpenVibe Navbar -->
    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/theme-loader.js" defer></script>
    <script>
    'use strict';

    // ─── Showcase interaction functions ───────────────────
    function quickTry(input, tool) {
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.value = input;
            setTool(tool);
        }
    }

    function setTool(toolId) {
        if (TOOLS[toolId]) {
            goTool(toolId);
        }
    }

    function buildShowcaseGrid() {
        const showcase = document.getElementById('showcase-grid');
        if (!showcase) return;
        const popular = ['myip', 'dns', 'ssl', 'ping', 'geoip', 'ip', 'rdns', 'headers'];
        showcase.innerHTML = popular.map(id => {
            const t = TOOLS[id];
            return `<div class="showcase-tool" onclick="setTool('${id}')" title="${t.name}">
                <div class="showcase-tool-icon"><i class="fa-solid ${t.icon}"></i></div>
                <div class="showcase-tool-label">${t.name.replace('OpenVibe', '')}</div>
            </div>`;
        }).join('');
    }

    // ═══════════════════════════════════════════════════════════
    // Net.OpenVibe — Client-Side App
    // Detects subdomain to determine active tool, renders UI,
    // calls /api/net/* endpoints on openvibe.tools.
    // ═══════════════════════════════════════════════════════════

    const API_BASE = 'https://openvibe.tools/api/net';

    // ── Tool definitions (mirrors server/net/config.js: endpoint and status must agree, which
    //    test/registry-consistency.test.js checks) ──────
    const TOOLS = {
        // Hub
        net:              { name: 'Network Tools',            icon: 'fa-network-wired',     cat: 'hub',   endpoint: null,        placeholder: 'Enter a domain, IP, or URL…' },
        lookup:           { name: 'Domain & IP Lookup',         icon: 'fa-magnifying-glass',  cat: 'hub',   endpoint: '/lookup',   placeholder: 'Domain, IP, or URL — we\'ll look up everything', btnText: 'Lookup All' },
        // IP / Identity
        myip:             { name: 'What Is My IP',           icon: 'fa-location-crosshairs', cat: 'ip',  endpoint: '/myip',     placeholder: null, auto: true },
        ip:               { name: 'IP Address Lookup',             icon: 'fa-at',                cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        ipv4:             { name: 'IPv4 Lookup & CIDR Calculator',           icon: 'fa-hashtag',           cat: 'ip',    endpoint: '/ipv4',     placeholder: 'IPv4 address, CIDR block (e.g. 192.168.1.0/24) or domain' },
        ipv6:             { name: 'IPv6 Lookup',           icon: 'fa-code',              cat: 'ip',    endpoint: '/ipv6',     placeholder: 'IPv6 address or domain' },
        geoip:            { name: 'IP Geolocation',          icon: 'fa-earth-americas',    cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        hostname:         { name: 'Hostname Lookup',       icon: 'fa-server',            cat: 'ip',    endpoint: '/rdns',     placeholder: 'IP address to resolve hostname' },
        isp:              { name: 'ISP Lookup',            icon: 'fa-building',          cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        asn:              { name: 'ASN Lookup',            icon: 'fa-diagram-project',   cat: 'ip',    endpoint: '/ip',       placeholder: 'IP address or domain' },
        rdns:             { name: 'Reverse DNS Lookup',     icon: 'fa-rotate-left',       cat: 'ip',    endpoint: '/rdns',     placeholder: 'IP address for reverse DNS' },
        whois:            { name: 'Whois Lookup',          icon: 'fa-address-book',      cat: 'ip',    endpoint: '/rdap',     placeholder: 'Domain or IP' },
        rdap:             { name: 'RDAP Lookup',           icon: 'fa-id-card',           cat: 'ip',    endpoint: '/rdap',     placeholder: 'Domain or IP for RDAP lookup' },
        // DNS
        dns:              { name: 'DNS Lookup',            icon: 'fa-sitemap',           cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain to query' },
        dig:              { name: 'Online dig',            icon: 'fa-terminal',          cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain (dig-style query)',   dnsTypes: true },
        nslookup:         { name: 'NSLookup',       icon: 'fa-magnifying-glass-arrow-right', cat: 'dns', endpoint: '/dns', placeholder: 'Domain for nslookup' },
        dnspropagation:   { name: 'DNS Propagation Checker', icon: 'fa-globe',            cat: 'dns',   endpoint: '/dnsprop',  placeholder: 'Domain to compare across public resolvers', propTypes: true },
        mx:               { name: 'MX Record Lookup',             icon: 'fa-envelope',          cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for MX records',     defaultTypes: 'MX' },
        txt:              { name: 'TXT Record Lookup',            icon: 'fa-file-lines',        cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for TXT records',    defaultTypes: 'TXT' },
        ns:               { name: 'Nameserver Lookup',             icon: 'fa-server',            cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for NS records',     defaultTypes: 'NS' },
        spf:              { name: 'SPF Record Checker',            icon: 'fa-shield-halved',     cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for SPF check',      defaultTypes: 'TXT' },
        dkim:             { name: 'DKIM Record Lookup',           icon: 'fa-key',               cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for DKIM',           defaultTypes: 'TXT' },
        dmarc:            { name: 'DMARC Checker',          icon: 'fa-user-shield',       cat: 'dns',   endpoint: '/dns',      placeholder: 'Domain for DMARC',          defaultTypes: 'TXT' },
        // Active diagnostics
        ping:             { name: 'Ping Test (TCP)',           icon: 'fa-satellite-dish',    cat: 'diag',  endpoint: '/ping',     placeholder: 'Host to ping (TCP port 443, from our server)' },
        traceroute:       { name: 'Traceroute',     icon: 'fa-route',             cat: 'diag',  endpoint: null, unavailable: 'Traceroute needs raw network access that this server does not give the tools, so it is not available. The TCP ping test shows whether a host answers and how fast.', instead: 'ping' },
        mtr:              { name: 'MTR Report',            icon: 'fa-chart-line',        cat: 'diag',  endpoint: null, unavailable: 'MTR needs raw network access that this server does not give the tools, so it is not available. The TCP ping test shows latency and loss to the host.', instead: 'ping' },
        port:             { name: 'Port Checker',      icon: 'fa-door-open',         cat: 'diag',  endpoint: '/port',     placeholder: 'Host to scan ports' },
        headers:          { name: 'HTTP Header Checker',        icon: 'fa-list',              cat: 'diag',  endpoint: '/headers',  placeholder: 'URL or domain' },
        redirects:        { name: 'Redirect Checker',      icon: 'fa-share',             cat: 'diag',  endpoint: '/redirects', placeholder: 'URL to follow redirects' },
        ssl:              { name: 'SSL Certificate Checker',            icon: 'fa-lock',              cat: 'diag',  endpoint: '/ssl',      placeholder: 'Domain for SSL check' },
        curl:             { name: 'Online curl',           icon: 'fa-download',          cat: 'diag',  endpoint: '/headers',  placeholder: 'URL' },
        httpstatus:       { name: 'HTTP Status Codes',     icon: 'fa-circle-check',      cat: 'diag',  endpoint: '/headers',  placeholder: 'URL to check' },
        latency:          { name: 'TCP Latency Test',        icon: 'fa-gauge-high',        cat: 'diag',  endpoint: '/ping',     placeholder: 'Host (10 timed TCP connections to port 443)', count: 10 },
        // Email & reputation
        blacklist:        { name: 'Blacklist Checker',     icon: 'fa-ban',               cat: 'mail',  endpoint: '/blacklist', placeholder: 'IPv4 address or domain' },
        reputation:       { name: 'Domain Reputation Checker', icon: 'fa-star',          cat: 'mail',  endpoint: null, unavailable: 'A combined reputation report is not available yet. The blacklist, SPF, DKIM and DMARC checkers cover its parts.', instead: 'blacklist' },
        smtp:             { name: 'SMTP Server Test',      icon: 'fa-paper-plane',       cat: 'mail',  endpoint: '/smtp',     placeholder: 'Mail server or domain (its MX is used)', smtpPorts: true },
        // Website checks
        uptime:           { name: 'Website Uptime Checker', icon: 'fa-heart-pulse',      cat: 'web',   endpoint: '/uptime',   placeholder: 'URL or domain' },
        robots:           { name: 'Robots.txt Tester',     icon: 'fa-robot',             cat: 'web',   endpoint: '/robots',   placeholder: 'Domain or URL', robotsTest: true },
        sitemap:          { name: 'Sitemap Validator',     icon: 'fa-sitemap',           cat: 'web',   endpoint: '/sitemap',  placeholder: 'Sitemap URL or domain' },
    };

    const CATS = {
        ip: { label: 'IP / Identity / Ownership', icon: 'fa-fingerprint' },
        dns: { label: 'DNS Tools', icon: 'fa-sitemap' },
        diag: { label: 'Active Diagnostics', icon: 'fa-satellite-dish' },
        mail: { label: 'Email & Reputation', icon: 'fa-envelope' },
        web: { label: 'Website Checks', icon: 'fa-globe' },
    };

    // ── Detect active tool from subdomain ────────────────────
    const host = location.hostname;
    const subdomain = host.replace(/\.openvibe\.tools$/, '');
    // The gateway names the tool in <meta name="ov-tool"> (descriptive hosts, mirrors, custom domains).
    const META_TOOL = (document.querySelector('meta[name="ov-tool"]') || {}).content || '';
    let activeTool = TOOLS[META_TOOL] ? META_TOOL : TOOLS[subdomain] ? subdomain : 'net';
    // Aliases
    if (subdomain === 'network') activeTool = 'net';
    if (subdomain === 'ptr') activeTool = 'rdns';
    if (subdomain === 'tls') activeTool = 'ssl';

    const tool = TOOLS[activeTool] || TOOLS.net;
    const isHub = activeTool === 'net';
    const isLookup = activeTool === 'lookup';

    // ── Set page title + meta ────────────────────────────────
    document.title = isHub ? 'Net.OpenVibe — Network & Internet Diagnostics' : `${tool.name} — ${tool.placeholder || 'Network Tool'}`;
    document.querySelector('meta[property="og:title"]').content = document.title;

    // ── Init ─────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        // Shared navbar + footer (openvibe.network)
        try {
            const token = localStorage.getItem('ov_token') || getCookie('ov_token');
            OpenVibeNavbar.init({
                service: 'net', apiBase: 'https://openvibe.network', token,
                history: { type: 'tool', title: isHub ? 'Net.OpenVibe' : tool.name },
                silentLogin: 'https://openvibe.tools/auth/login?silent=1&next={url}',
            });
        } catch {}
        try {
            OpenVibeFooter.init({
                service: 'net', variant: isHub ? 'full' : 'compact', mount: '#ov-footer', apiBase: 'https://openvibe.network',
                links: [
                    { heading: 'Network tools', items: [
                        { name: 'Domain & IP lookup', url: 'https://lookup.openvibe.tools' },
                        { name: 'DNS lookup', url: 'https://dns.openvibe.tools' },
                        { name: 'Ping', url: 'https://ping.openvibe.tools' },
                        { name: 'SSL checker', url: 'https://ssl.openvibe.tools' },
                        { name: 'Whois', url: 'https://whois.openvibe.tools' },
                        { name: 'HTTP headers', url: 'https://headers.openvibe.tools' },
                    ] },
                    { heading: 'Email & uptime', items: [
                        { name: 'SPF checker', url: 'https://spf.openvibe.tools' },
                        { name: 'DMARC checker', url: 'https://dmarc.openvibe.tools' },
                        { name: 'Blacklist check', url: 'https://blacklist.openvibe.tools' },
                        { name: 'Uptime check', url: 'https://uptime.openvibe.tools' },
                        { name: 'All network tools', url: 'https://net.openvibe.tools' },
                    ] },
                ],
            });
        } catch {}

        setupUI();

        // Show showcase on hub
        if (isHub) {
            document.getElementById('showcase-section').style.display = '';
            buildShowcaseGrid();
            const n = Object.values(TOOLS).filter(t => t.endpoint && !t.unavailable).length;
            document.getElementById('stat-tools').textContent = String(n);
        }

        // If tool auto-runs (myip), do it immediately
        if (tool.auto) runTool();

        // Enter key
        const input = document.getElementById('search-input');
        if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') runTool(); });

        // Check for ?q= parameter
        const params = new URLSearchParams(location.search);
        const q = params.get('q') || params.get('target') || params.get('domain') || params.get('ip');
        if (q && input) { input.value = q; runTool(); }
    });

    function getCookie(name) {
        const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return v ? v.pop() : null;
    }

    // ── Setup UI based on active tool ────────────────────────
    function setupUI() {
        const hero = document.getElementById('hero');
        const heroIcon = hero.querySelector('.hero-icon');
        const heroH1 = hero.querySelector('h1');
        const heroSub = hero.querySelector('.sub');
        const searchInput = document.getElementById('search-input');
        const btnGo = document.getElementById('btn-go');
        const chipsArea = document.getElementById('tool-chips-area');

        // Update hero
        heroIcon.innerHTML = `<i class="fa-solid ${tool.icon}"></i>`;
        if (isHub) {
            heroH1.innerHTML = '<span class="accent">OpenVibe</span>Net';
            heroSub.textContent = 'Online network diagnostics — DNS, GeoIP, ping, SSL, Whois, HTTP headers, and more. No login required.';
        } else {
            heroH1.innerHTML = tool.name.replace('OpenVibe', '<span class="accent">OpenVibe</span>');
            heroSub.textContent = tool.placeholder || '';
        }

        // Update search
        if (tool.placeholder) {
            searchInput.placeholder = tool.placeholder;
        }
        if (tool.auto || tool.unavailable) {
            document.getElementById('search-bar').style.display = 'none';
        }
        // A tool this server cannot run: say so where the results would be, and point at what works.
        if (tool.unavailable) {
            const box = document.createElement('div');
            box.className = 'card tool-unavailable';
            box.setAttribute('role', 'status');
            const head = document.createElement('div');
            head.className = 'card-head';
            head.textContent = 'Not available';
            const p = document.createElement('p');
            p.textContent = tool.unavailable;
            box.append(head, p);
            if (tool.instead && TOOLS[tool.instead]) {
                const a = document.createElement('a');
                a.className = 'pivot';
                a.href = `https://${tool.instead}.openvibe.tools`;
                a.textContent = `Open the ${TOOLS[tool.instead].name}`;
                box.append(a);
            }
            document.getElementById('results').append(box);
        }
        if (tool.btnText) {
            btnGo.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> ${tool.btnText}`;
        }

        // Build tool chips or tool selector
        if (isHub) {
            // Hub: show tool directory
            document.getElementById('hub-directory').style.display = '';
            buildHubDirectory();
            // Quick-pick chips
            const popular = ['lookup', 'myip', 'dns', 'ping', 'ssl', 'geoip', 'whois', 'headers', 'rdns', 'port'];
            chipsArea.innerHTML = `<div class="tool-chips">${popular.map(id => {
                const t = TOOLS[id];
                return `<span class="tool-chip" onclick="goTool('${id}')"><i class="fa-solid ${t.icon}"></i> ${t.name.replace('OpenVibe', '')}</span>`;
            }).join('')}</div>`;
        } else {
            // Tool page: show related tools as mini-nav
            const related = Object.entries(TOOLS).filter(([,t]) => t.cat === tool.cat && !t.auto && !t.unavailable);
            if (related.length > 1) {
                chipsArea.innerHTML = `<div class="tool-selector">${related.map(([id, t]) => {
                    const active = id === activeTool ? ' active' : '';
                    return `<button class="ts-btn${active}" onclick="goTool('${id}')"><i class="fa-solid ${t.icon}"></i> ${t.name.replace('OpenVibe', '')}</button>`;
                }).join('')}</div>`;
            }
        }

        // Tool options
        const opts = document.getElementById('options-area');
        if (tool.propTypes) {
            opts.innerHTML = `<div class="options-row"><label for="prop-type">Record type:</label>
                <select id="prop-type">${['A', 'AAAA', 'CNAME', 'MX', 'NS', 'TXT'].map(t => `<option value="${t}">${t}</option>`).join('')}</select></div>`;
        }
        if (tool.smtpPorts) {
            opts.innerHTML = `<div class="options-row"><label for="smtp-port">Port:</label>
                <select id="smtp-port"><option value="25">25 (server to server)</option><option value="587">587 (submission)</option></select></div>`;
        }
        if (tool.robotsTest) {
            opts.innerHTML = `<div class="options-row"><label for="robots-path">Test a path (optional):</label>
                <input id="robots-path" type="text" placeholder="/private/page.html" spellcheck="false" style="min-width:200px">
                <label for="robots-ua">as</label>
                <select id="robots-ua"><option value="*">any crawler (*)</option><option>Googlebot</option><option>Bingbot</option><option>GPTBot</option></select></div>`;
        }

        // DNS type options
        if (tool.dnsTypes) {
            const types = ['A', 'AAAA', 'MX', 'TXT', 'CNAME', 'NS', 'SOA', 'PTR', 'CAA', 'SRV'];
            document.getElementById('options-area').innerHTML = `<div class="options-row">
                <label>Record types:</label>
                <select id="dns-types" multiple style="min-width:200px;min-height:28px">
                    ${types.map(t => `<option value="${t}" ${['A','AAAA','MX','TXT','NS'].includes(t) ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
            </div>`;
        }
    }

    // ── Hub directory ────────────────────────────────────────
    function buildHubDirectory() {
        const dir = document.getElementById('hub-directory');
        let html = '';
        for (const [catId, cat] of Object.entries(CATS)) {
            const tools = Object.entries(TOOLS).filter(([, t]) => t.cat === catId);
            html += `<div class="cat-group">
                <h2><i class="fa-solid ${cat.icon}"></i> ${cat.label}</h2>
                <div class="tool-grid">${tools.map(([id, t]) => `
                    <a class="tool-card" href="https://${id}.openvibe.tools" onclick="goTool('${id}');return false;">
                        <div class="tc-icon"><i class="fa-solid ${t.icon}"></i></div>
                        <div class="tc-info">
                            <h3>${t.name}</h3>
                            <p>${t.unavailable ? 'Not available' : (t.placeholder || '')}</p>
                            <div class="tc-domain">${id}.openvibe.tools</div>
                        </div>
                    </a>
                `).join('')}</div>
            </div>`;
        }
        dir.innerHTML = html;
    }

    // ── Navigate to a tool ───────────────────────────────────
    function goTool(id) {
        const input = document.getElementById('search-input');
        const q = input ? input.value.trim() : '';
        const url = `https://${id}.openvibe.tools${q ? '?q=' + encodeURIComponent(q) : ''}`;
        location.href = url;
    }

    // ── Run the active tool ──────────────────────────────────
    async function runTool() {
        const input = document.getElementById('search-input');
        const target = input ? input.value.trim() : '';
        const resultsEl = document.getElementById('results');

        // Hub: if user types something, redirect to lookup
        if (isHub && target) {
            location.href = `https://lookup.openvibe.tools?q=${encodeURIComponent(target)}`;
            return;
        }

        if (!tool.endpoint || tool.unavailable) return;
        if (!target && !tool.auto) { toast('Please enter a domain, IP, or URL', 'error'); return; }

        // Show loading
        resultsEl.innerHTML = `<div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Running ${tool.name}…</p></div>`;

        try {
            let url = `${API_BASE}${tool.endpoint}`;
            const params = new URLSearchParams();
            if (target) params.set('target', target);

            // DNS type overrides
            if (tool.defaultTypes) params.set('types', tool.defaultTypes);
            if (tool.dnsTypes) {
                const sel = document.getElementById('dns-types');
                if (sel) {
                    const selected = [...sel.selectedOptions].map(o => o.value);
                    if (selected.length) params.set('types', selected.join(','));
                }
            }
            // DKIM special: query selector._domainkey.domain
            if (activeTool === 'dkim' && target) {
                const selector = prompt('DKIM selector (e.g., "default", "google", "s1"):', 'default') || 'default';
                params.set('target', `${selector}._domainkey.${target}`);
            }
            // DMARC: prepend _dmarc.
            if (activeTool === 'dmarc' && target) {
                params.set('target', `_dmarc.${target}`);
            }
            // SPF: just TXT
            if (activeTool === 'spf') params.set('types', 'TXT');
            if (tool.count) params.set('count', String(tool.count));
            if (tool.propTypes) params.set('type', document.getElementById('prop-type').value);
            if (tool.smtpPorts) params.set('port', document.getElementById('smtp-port').value);
            if (tool.robotsTest) {
                const p = document.getElementById('robots-path').value.trim();
                if (p) { params.set('path', p); params.set('ua', document.getElementById('robots-ua').value); }
            }

            const qs = params.toString();
            if (qs) url += (url.includes('?') ? '&' : '?') + qs;

            const token = localStorage.getItem('ov_token') || getCookie('ov_token');
            const headers = {};
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const r = await fetch(url, { headers });
            const data = await r.json();

            if (!data.ok) throw new Error(data.error || 'Lookup failed');

            renderResults(data);
        } catch (err) {
            resultsEl.innerHTML = `<div class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> ${esc(err.message)}</div>`;
        }
    }

    // ── Render results based on tool type ────────────────────
    function renderResults(data) {
        const el = document.getElementById('results');

        // Route to specialized renderers
        if (activeTool === 'myip') return renderMyIP(el, data);
        if (activeTool === 'lookup' || isLookup) return renderLookup(el, data);
        if (tool.endpoint === '/ip') return renderIP(el, data);
        if (tool.endpoint === '/ipv4') return renderIPv4(el, data);
        if (tool.endpoint === '/ipv6') return renderIPv6(el, data);
        if (tool.endpoint === '/dns') return renderDNS(el, data);
        if (tool.endpoint === '/rdns') return renderRDNS(el, data);
        if (tool.endpoint === '/rdap') return renderRDAP(el, data);
        if (tool.endpoint === '/ssl') return renderSSL(el, data);
        if (tool.endpoint === '/headers') return renderHeaders(el, data);
        if (tool.endpoint === '/redirects') return renderRedirects(el, data);
        if (tool.endpoint === '/port') return renderPort(el, data);
        if (tool.endpoint === '/ping') return renderPing(el, data);
        if (tool.endpoint === '/dnsprop') return renderDnsProp(el, data);
        if (tool.endpoint === '/blacklist') return renderBlacklist(el, data);
        if (tool.endpoint === '/smtp') return renderSMTP(el, data);
        if (tool.endpoint === '/uptime') return renderUptime(el, data);
        if (tool.endpoint === '/robots') return renderRobots(el, data);
        if (tool.endpoint === '/sitemap') return renderSitemap(el, data);

        // Fallback: raw JSON
        el.innerHTML = `<div class="card"><div class="raw-block">${esc(JSON.stringify(data, null, 2))}</div></div>`;
    }

    // ── Renderers ────────────────────────────────────────────

    function renderMyIP(el, data) {
        el.innerHTML = `<div class="myip-card">
            <div style="font-size:13px;color:var(--text-muted)">Your Public IP Address</div>
            <div class="ip-display">${esc(data.ip)}</div>
            <button class="copy-btn" onclick="copyText('${esc(data.ip)}')"><i class="fa-solid fa-copy"></i> Copy</button>
            <div style="margin-top:12px">
                <span class="pivot" onclick="goLookup('${esc(data.ip)}')"><i class="fa-solid fa-magnifying-glass"></i> Full lookup</span>
                &nbsp;
                <span class="pivot" onclick="goToolWithTarget('geoip','${esc(data.ip)}')"><i class="fa-solid fa-earth-americas"></i> GeoIP</span>
                &nbsp;
                <span class="pivot" onclick="goToolWithTarget('rdns','${esc(data.ip)}')"><i class="fa-solid fa-rotate-left"></i> Reverse DNS</span>
            </div>
        </div>`;
        // Also fetch full IP info
        fetchAndAppendIPInfo(el, data.ip);
    }

    async function fetchAndAppendIPInfo(el, ip) {
        try {
            const token = localStorage.getItem('ov_token') || getCookie('ov_token');
            const headers = {};
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const r = await fetch(`${API_BASE}/ip?target=${encodeURIComponent(ip)}`, { headers });
            const data = await r.json();
            if (data.ok) {
                el.innerHTML += renderIPCard(data);
            }
        } catch {}
    }

    function renderIP(el, data) {
        el.innerHTML = renderIPCard(data);
    }

    function renderIPCard(data) {
        const geo = data.geo || {};
        const net = data.network || {};
        return `
            <div class="badges">
                ${geo.city ? `<span class="badge badge-cyan">📍 ${esc(geo.city)}, ${esc(geo.country)}</span>` : ''}
                ${net.isp ? `<span class="badge badge-blue">🏢 ${esc(net.isp)}</span>` : ''}
                ${net.as ? `<span class="badge">🔗 ${esc(net.as)}</span>` : ''}
                ${data.reverse ? `<span class="badge">🔄 ${esc(data.reverse)}</span>` : ''}
            </div>
            <div class="card">
                <div class="card-head"><i class="fa-solid fa-earth-americas"></i> GeoIP & Network</div>
                <table class="res-table">
                    <tr><td class="key">IP</td><td class="val">${esc(data.ip)}</td></tr>
                    ${data.hostname ? `<tr><td class="key">Hostname</td><td class="val">${esc(data.hostname)}</td></tr>` : ''}
                    <tr><td class="key">Country</td><td class="val">${esc(geo.country || '—')} (${esc(geo.countryCode || '')})</td></tr>
                    <tr><td class="key">Region</td><td class="val">${esc(geo.region || '—')}</td></tr>
                    <tr><td class="key">City</td><td class="val">${esc(geo.city || '—')}</td></tr>
                    <tr><td class="key">Timezone</td><td class="val">${esc(geo.timezone || '—')}</td></tr>
                    <tr><td class="key">Coordinates</td><td class="val">${geo.lat != null ? `${geo.lat}, ${geo.lon}` : '—'}</td></tr>
                    <tr><td class="key">ISP</td><td class="val">${esc(net.isp || '—')}</td></tr>
                    <tr><td class="key">Organization</td><td class="val">${esc(net.org || '—')}</td></tr>
                    <tr><td class="key">AS</td><td class="val">${esc(net.as || '—')}</td></tr>
                    <tr><td class="key">AS Name</td><td class="val">${esc(net.asname || '—')}</td></tr>
                    ${data.reverse ? `<tr><td class="key">Reverse DNS</td><td class="val">${esc(data.reverse)}</td></tr>` : ''}
                </table>
            </div>
            <div style="text-align:center;margin-top:8px">
                <span class="pivot" onclick="goLookup('${esc(data.ip)}')"><i class="fa-solid fa-magnifying-glass"></i> Full lookup</span>
                &nbsp;
                <span class="pivot" onclick="goToolWithTarget('rdns','${esc(data.ip)}')"><i class="fa-solid fa-rotate-left"></i> Reverse DNS</span>
                &nbsp;
                <span class="pivot" onclick="goToolWithTarget('whois','${esc(data.ip)}')"><i class="fa-solid fa-address-book"></i> Whois</span>
            </div>`;
    }

    function renderDNS(el, data) {
        const records = data.records || {};
        let html = `<div class="badges"><span class="badge badge-cyan">🔍 ${esc(data.target)}</span><span class="badge">📡 Server: ${esc(data.server)}</span></div>`;
        for (const [type, recs] of Object.entries(records)) {
            if (recs.error) {
                html += `<div class="card"><div class="card-head"><i class="fa-solid fa-sitemap"></i> ${type}</div><p style="color:var(--text-muted);font-size:13px">No ${type} records (${recs.error})</p></div>`;
                continue;
            }
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-sitemap"></i> ${type} Records</div>`;
            if (Array.isArray(recs) && recs.length > 0) {
                if (type === 'MX') {
                    html += `<table class="res-table"><tr><th>Priority</th><th>Exchange</th></tr>${recs.map(r => `<tr><td class="val">${r.priority}</td><td class="val">${esc(typeof r === 'object' ? r.exchange : r)}</td></tr>`).join('')}</table>`;
                } else if (type === 'SOA') {
                    const soa = recs;
                    html += `<table class="res-table">
                        <tr><td class="key">Primary NS</td><td class="val">${esc(soa.nsname || soa[0]?.nsname || '—')}</td></tr>
                        <tr><td class="key">Hostmaster</td><td class="val">${esc(soa.hostmaster || soa[0]?.hostmaster || '—')}</td></tr>
                        <tr><td class="key">Serial</td><td class="val">${soa.serial || soa[0]?.serial || '—'}</td></tr>
                        <tr><td class="key">Refresh</td><td class="val">${soa.refresh || soa[0]?.refresh || '—'}s</td></tr>
                        <tr><td class="key">Retry</td><td class="val">${soa.retry || soa[0]?.retry || '—'}s</td></tr>
                        <tr><td class="key">Expire</td><td class="val">${soa.expire || soa[0]?.expire || '—'}s</td></tr>
                        <tr><td class="key">Min TTL</td><td class="val">${soa.minttl || soa[0]?.minttl || '—'}s</td></tr>
                    </table>`;
                } else if (type === 'TXT') {
                    html += `<div style="display:flex;flex-direction:column;gap:6px">${recs.map(r => {
                        const txt = Array.isArray(r) ? r.join('') : (typeof r === 'object' ? (r.data || JSON.stringify(r)) : r);
                        const isSPF = txt.startsWith('v=spf1');
                        const isDMARC = txt.startsWith('v=DMARC1');
                        const isDKIM = txt.startsWith('v=DKIM1');
                        const label = isSPF ? '🛡️ SPF' : isDMARC ? '🛡️ DMARC' : isDKIM ? '🔑 DKIM' : '';
                        return `<div class="raw-block">${label ? `<strong>${label}</strong> ` : ''}${esc(txt)}</div>`;
                    }).join('')}</div>`;
                } else {
                    html += `<table class="res-table"><tr><th>Value</th></tr>${recs.map(r => {
                        const val = typeof r === 'object' ? (r.data || JSON.stringify(r)) : r;
                        return `<tr><td class="val">${esc(String(val))}</td></tr>`;
                    }).join('')}</table>`;
                }
            } else {
                html += `<p style="color:var(--text-muted);font-size:13px">No records found</p>`;
            }
            html += `</div>`;
        }

        // Pivot links
        html += `<div style="text-align:center;margin-top:8px">
            <span class="pivot" onclick="goLookup('${esc(data.target)}')"><i class="fa-solid fa-magnifying-glass"></i> Full lookup</span>
            &nbsp;
            <span class="pivot" onclick="goToolWithTarget('ssl','${esc(data.target)}')"><i class="fa-solid fa-lock"></i> SSL</span>
            &nbsp;
            <span class="pivot" onclick="goToolWithTarget('whois','${esc(data.target)}')"><i class="fa-solid fa-address-book"></i> Whois</span>
        </div>`;

        el.innerHTML = html;
    }

    function renderRDNS(el, data) {
        el.innerHTML = `<div class="card">
            <div class="card-head"><i class="fa-solid fa-rotate-left"></i> Reverse DNS</div>
            <table class="res-table">
                <tr><td class="key">IP</td><td class="val">${esc(data.ip)}</td></tr>
                <tr><td class="key">PTR / Hostname</td><td class="val">${data.hostnames?.length ? data.hostnames.map(h => esc(h)).join('<br>') : '<span style="color:var(--text-muted)">No PTR record</span>'}</td></tr>
            </table>
        </div>`;
    }

    function renderRDAP(el, data) {
        const s = data.summary || {};
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.target)}</span>
            <span class="badge">${esc(data.type)}</span>
            ${(s.status || []).map(st => `<span class="badge ${st.includes('active') ? 'badge-green' : ''}">${esc(st)}</span>`).join('')}
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-id-card"></i> Registration Data (RDAP)</div>
            <table class="res-table">
                <tr><td class="key">Name</td><td class="val">${esc(s.name || data.target)}</td></tr>
                <tr><td class="key">Handle</td><td class="val">${esc(s.handle || '—')}</td></tr>
                ${(s.events || []).map(e => `<tr><td class="key">${esc(e.action)}</td><td class="val">${esc(e.date)}</td></tr>`).join('')}
                ${s.nameservers?.length ? `<tr><td class="key">Nameservers</td><td class="val">${s.nameservers.map(n => esc(n)).join('<br>')}</td></tr>` : ''}
                ${s.port43 ? `<tr><td class="key">Whois Server</td><td class="val">${esc(s.port43)}</td></tr>` : ''}
            </table>
        </div>`;
        if (s.entities?.length) {
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-users"></i> Entities</div>
                <table class="res-table"><tr><th>Handle</th><th>Roles</th><th>Name</th></tr>
                ${s.entities.map(e => `<tr><td class="val">${esc(e.handle || '—')}</td><td>${(e.roles||[]).join(', ')}</td><td>${esc(e.name || '—')}</td></tr>`).join('')}
                </table></div>`;
        }
        // Raw toggle
        html += `<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--text-muted);font-size:13px">Raw RDAP response</summary>
            <div class="raw-block" style="margin-top:8px">${esc(JSON.stringify(data.raw, null, 2))}</div></details>`;
        el.innerHTML = html;
    }

    function renderSSL(el, data) {
        const c = data.certificate || {};
        const statusClass = c.isExpired ? 'badge-red' : c.isExpiringSoon ? 'badge-yellow' : 'badge-green';
        const statusText = c.isExpired ? '🔴 EXPIRED' : c.isExpiringSoon ? `🟡 Expires in ${c.daysLeft}d` : `🟢 Valid (${c.daysLeft}d left)`;
        let html = `<div class="badges">
            <span class="badge ${statusClass}">${statusText}</span>
            <span class="badge badge-cyan">${esc(data.protocol || '')}</span>
            ${data.cipher ? `<span class="badge">${esc(data.cipher.name)}</span>` : ''}
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-lock"></i> SSL Certificate</div>
            <table class="res-table">
                <tr><td class="key">Subject</td><td class="val">${esc(c.subject?.CN || '—')}</td></tr>
                <tr><td class="key">Issuer</td><td class="val">${esc(c.issuer?.CN || c.issuer?.O || '—')}</td></tr>
                <tr><td class="key">Serial</td><td class="val" style="font-size:11px">${esc(c.serialNumber || '—')}</td></tr>
                <tr><td class="key">Valid From</td><td class="val">${esc(c.validFrom || '—')}</td></tr>
                <tr><td class="key">Valid To</td><td class="val">${esc(c.validTo || '—')}</td></tr>
                <tr><td class="key">Days Left</td><td class="val ${c.isExpired ? 'style="color:var(--red)"' : ''}">${c.daysLeft}</td></tr>
                <tr><td class="key">SANs</td><td class="val">${c.sans?.length ? c.sans.map(s => esc(s)).join(', ') : '—'}</td></tr>
                <tr><td class="key">Fingerprint</td><td class="val" style="font-size:10px">${esc(c.fingerprint || '—')}</td></tr>
            </table>
        </div>`;
        if (data.chain?.length) {
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-link"></i> Certificate Chain</div>
                <table class="res-table"><tr><th>Subject</th><th>Issuer</th><th>Valid To</th></tr>
                ${data.chain.map(c => `<tr><td class="val">${esc(c.subject)}</td><td>${esc(c.issuer)}</td><td>${esc(c.validTo)}</td></tr>`).join('')}
                </table></div>`;
        }
        el.innerHTML = html;
    }

    function renderHeaders(el, data) {
        const h = data.headers || {};
        let html = `<div class="badges">
            <span class="badge ${data.status < 400 ? 'badge-green' : 'badge-red'}">HTTP ${data.status} ${esc(data.statusText || '')}</span>
            ${data.server ? `<span class="badge">Server: ${esc(data.server)}</span>` : ''}
            ${data.timing ? `<span class="badge badge-cyan">⚡ ${data.timing.ms}ms</span>` : ''}
            <span class="badge">Security: ${data.securityScore || '?/6'}</span>
        </div>`;
        // Security analysis
        const sec = data.security || {};
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-shield-halved"></i> Security Headers</div>
            <table class="res-table">
                <tr><td class="key">HSTS</td><td class="val">${sec.hasHSTS ? '✅ Present' : '❌ Missing'}</td></tr>
                <tr><td class="key">CSP</td><td class="val">${sec.hasCSP ? '✅ Present' : '❌ Missing'}</td></tr>
                <tr><td class="key">X-Content-Type-Options</td><td class="val">${sec.hasXCTO ? '✅ nosniff' : '❌ Missing'}</td></tr>
                <tr><td class="key">X-Frame-Options</td><td class="val">${sec.hasXFO ? '✅ Present' : '❌ Missing'}</td></tr>
                <tr><td class="key">Referrer-Policy</td><td class="val">${sec.hasRP ? '✅ Present' : '❌ Missing'}</td></tr>
                <tr><td class="key">Permissions-Policy</td><td class="val">${sec.hasPermissions ? '✅ Present' : '❌ Missing'}</td></tr>
            </table>
        </div>`;
        // All headers
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-list"></i> Response Headers</div>
            <table class="res-table">${Object.entries(h).map(([k, v]) => `<tr><td class="key">${esc(k)}</td><td class="val">${esc(v)}</td></tr>`).join('')}</table>
        </div>`;
        el.innerHTML = html;
    }

    function renderRedirects(el, data) {
        const chain = data.chain || [];
        let html = `<div class="badges">
            <span class="badge badge-cyan">${chain.length} hop${chain.length !== 1 ? 's' : ''}</span>
            <span class="badge badge-green">Final: ${esc(data.finalUrl || '')}</span>
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-share"></i> Redirect Chain</div>
            <table class="res-table"><tr><th>#</th><th>URL</th><th>Status</th><th>Time</th></tr>
            ${chain.map((h, i) => `<tr>
                <td class="val">${i + 1}</td>
                <td class="val" style="max-width:400px;overflow:hidden;text-overflow:ellipsis">${esc(h.url)}</td>
                <td>${h.status == null ? `<span class="badge badge-red" title="${esc(h.error || '')}">${h.refused ? 'refused' : 'error'}</span>` : `<span class="badge ${h.status < 400 ? (h.status >= 300 ? 'badge-yellow' : 'badge-green') : 'badge-red'}">${h.status}</span>`}</td>
                <td class="val">${h.ms}ms</td>
            </tr>`).join('')}
            </table>${data.stopped ? `<p style="color:var(--text-muted);font-size:13px">Stopped: ${esc(data.stopped)}</p>` : ''}</div>`;
        el.innerHTML = html;
    }

    function renderPort(el, data) {
        const ports = data.ports || [];
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.target)} (${esc(data.ip)})</span>
            <span class="badge badge-green">${ports.filter(p => p.status === 'open').length} open</span>
            <span class="badge badge-red">${ports.filter(p => p.status !== 'open').length} closed/filtered</span>
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-door-open"></i> Port Scan Results</div>
            <table class="res-table"><tr><th>Port</th><th>Status</th><th>Latency</th></tr>
            ${ports.map(p => `<tr>
                <td class="val">${p.port}</td>
                <td><span class="badge ${p.status === 'open' ? 'badge-green' : p.status === 'filtered' ? 'badge-yellow' : 'badge-red'}">${p.status}</span></td>
                <td class="val">${p.ms}ms</td>
            </tr>`).join('')}
            </table></div>`;
        el.innerHTML = html;
    }

    function renderPing(el, data) {
        const results = data.results || [];
        const stats = data.stats || {};
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.target)} (${esc(data.ip)})</span>
            <span class="badge badge-green">Avg: ${stats.avg}ms</span>
            <span class="badge">Min: ${stats.min}ms / Max: ${stats.max}ms</span>
            <span class="badge ${stats.loss > 0 ? 'badge-red' : 'badge-green'}">Loss: ${stats.loss}%</span>
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-satellite-dish"></i> Ping Results (TCP)</div>
            <table class="res-table"><tr><th>Seq</th><th>Status</th><th>Time</th></tr>
            ${results.map(r => `<tr>
                <td class="val">${r.seq}</td>
                <td><span class="badge ${r.status === 'ok' ? 'badge-green' : 'badge-red'}">${r.status}</span></td>
                <td class="val">${r.ms}ms</td>
            </tr>`).join('')}
            </table>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
                <table class="res-table">
                    <tr><td class="key">Min</td><td class="val">${stats.min}ms</td><td class="key">Max</td><td class="val">${stats.max}ms</td></tr>
                    <tr><td class="key">Avg</td><td class="val">${stats.avg}ms</td><td class="key">Loss</td><td class="val">${stats.loss}%</td></tr>
                </table>
            </div>
        </div>`;
        el.innerHTML = html;
    }

    // ── IPv4 (address or CIDR block) and IPv6 ────────────────
    function renderIPv4(el, data) {
        const v = data.ipv4 || {};
        const c = data.cidr;
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(c && c.prefix < 32 ? c.cidr : data.ip)}</span>
            <span class="badge">Class ${esc(v.class)}</span>
            <span class="badge ${v.isPublic ? 'badge-green' : 'badge-yellow'}">${esc(v.type)}</span>
        </div>`;
        if (c && c.prefix < 32) {
            const n = (x) => Number(x).toLocaleString('en-US');
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-hashtag"></i> Subnet ${esc(c.cidr)}</div><table class="res-table">
                ${row('Network', esc(c.network))}${c.broadcast ? row('Broadcast', esc(c.broadcast)) : ''}
                ${row('Netmask', esc(c.netmask))}${row('Wildcard', esc(c.wildcard))}
                ${row('Usable hosts', `${esc(c.firstUsable)} – ${esc(c.lastUsable)}`)}
                ${row('Addresses', `${n(c.total)} total, ${n(c.usable)} usable`)}
            </table></div>`;
        }
        if (data.geo) html += renderIPCard(data);
        else if (data.note) html += `<p style="color:var(--text-muted);font-size:13px">${esc(data.note)}</p>`;
        el.innerHTML = html;
    }

    function renderIPv6(el, data) {
        const v = data.ipv6 || {};
        const nw = data.network;
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.ip)}</span>
            <span class="badge ${v.type === 'Global unicast' ? 'badge-green' : 'badge-yellow'}">${esc(v.type)}</span>
            ${v.scope ? `<span class="badge">scope: ${esc(v.scope)}</span>` : ''}
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-code"></i> IPv6 address</div><table class="res-table">
            ${row('Compressed', esc(v.compressed))}${row('Expanded', esc(v.expanded))}
            ${v.prefix ? row('Range', esc(v.prefix)) : ''}
            ${row('Reverse DNS', v.ptr ? esc(v.ptr) : '<span style="color:var(--text-muted)">No PTR record</span>')}
            ${nw ? row('Network', `${esc(nw.org || nw.isp || '—')}${nw.as ? ` (${esc(nw.as)})` : ''}`) : ''}
            ${data.geo && data.geo.country ? row('Location', esc([data.geo.city, data.geo.country].filter(Boolean).join(', '))) : ''}
        </table></div>`;
        el.innerHTML = html;
    }

    // ── Website, mail and DNS checks ─────────────────────────
    const row = (k, v) => `<tr><td class="key">${esc(k)}</td><td class="val">${v}</td></tr>`;
    const from = (data) => data.checkedFrom ? `<p style="color:var(--text-muted);font-size:12px;margin-top:8px">Checked from ${esc(data.checkedFrom)}.</p>` : '';

    function renderDnsProp(el, data) {
        const list = data.resolvers || [];
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.target)} ${esc(data.type)}</span>
            <span class="badge ${data.agree ? 'badge-green' : 'badge-yellow'}">${data.agree ? 'All resolvers agree' : 'Resolvers disagree'}</span>
            <span class="badge">${data.answered}/${list.length} answered</span>
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-globe"></i> Public resolvers</div>
            <table class="res-table"><tr><th>Resolver</th><th>Answer</th><th>Time</th></tr>
            ${list.map(r => `<tr>
                <td class="val">${esc(r.name)}<br><span style="color:var(--text-muted);font-size:11px">${esc(r.ip)}</span></td>
                <td class="val">${r.status === 'ok' ? r.answers.map(a => esc(a)).join('<br>') : `<span class="badge ${r.status === 'error' ? 'badge-red' : ''}">${esc(r.status === 'error' ? (r.error || 'error') : r.status === 'nxdomain' ? 'NXDOMAIN (no such name)' : 'no record')}</span>`}
                    ${r.differs ? ' <span class="badge badge-yellow">differs</span>' : ''}</td>
                <td class="val">${r.ms}ms</td></tr>`).join('')}
            </table>${from(data)}</div>`;
        el.innerHTML = html;
    }

    function renderBlacklist(el, data) {
        const lists = data.lists || [];
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.domain || data.ip || data.target)}${data.domain && data.ip ? ` (${esc(data.ip)})` : ''}</span>
            <span class="badge ${data.listedCount ? 'badge-red' : 'badge-green'}">${data.listedCount ? `Listed on ${data.listedCount}` : 'Not listed'}</span>
            ${data.unknownCount ? `<span class="badge badge-yellow">${data.unknownCount} could not be checked</span>` : ''}
        </div>`;
        if (data.domain && !data.ip) html += `<p style="color:var(--text-muted);font-size:13px">${esc(data.domain)} has no IPv4 address, so only the domain lists were checked.</p>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-ban"></i> Blacklists</div>
            <table class="res-table"><tr><th>List</th><th>Checked</th><th>Result</th></tr>
            ${lists.map(l => `<tr>
                <td class="val">${esc(l.name)}<br><span style="color:var(--text-muted);font-size:11px">${esc(l.zone)}</span></td>
                <td class="val">${esc(l.query)}</td>
                <td>${l.listed === true ? `<span class="badge badge-red">Listed</span> ${l.reason ? `<div style="font-size:12px;margin-top:4px">${esc(l.reason)}</div>` : ''} <a class="pivot" href="${esc(l.delist)}" target="_blank" rel="noopener">Delisting</a>`
                    : l.listed === false ? '<span class="badge badge-green">Not listed</span>'
                        : `<span class="badge badge-yellow" title="${esc(l.error || '')}">Unknown</span><div style="font-size:11px;color:var(--text-muted);margin-top:4px">${esc(l.error || '')}</div>`}</td>
            </tr>`).join('')}
            </table>${from(data)}</div>`;
        el.innerHTML = html;
    }

    function renderSMTP(el, data) {
        let html = `<div class="badges">
            <span class="badge badge-cyan">${esc(data.host)}:${data.port} (${esc(data.ip)})</span>
            <span class="badge ${data.connected ? 'badge-green' : 'badge-red'}">${data.connected ? 'Connected' : 'No connection'}</span>
            ${data.starttls ? `<span class="badge ${data.starttls.ok ? 'badge-green' : data.starttls.offered ? 'badge-yellow' : 'badge-red'}">${data.starttls.ok ? 'STARTTLS ' + esc(data.starttls.protocol || '') : data.starttls.offered ? 'STARTTLS failed' : 'No STARTTLS'}</span>` : ''}
        </div>`;
        if (data.mx && data.mx.length) html += `<p style="color:var(--text-muted);font-size:13px">${esc(data.target)} receives mail at ${data.mx.map(m => `${esc(m.exchange)} (${m.priority})`).join(', ')}; tested the first.</p>`;
        if (data.error) html += `<div class="error-msg" style="margin-bottom:12px">${esc(data.error)}</div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-paper-plane"></i> Conversation</div><table class="res-table">
            ${data.connectMs != null ? row('Connect time', `${data.connectMs}ms`) : ''}
            ${data.banner ? row('Greeting', `${data.banner.code} ${esc(data.banner.text)}`) : ''}
            ${data.ehlo ? row('EHLO', `${data.ehlo.code} ${esc(data.ehlo.greeting)}`) : ''}
            ${data.ehlo ? row('Extensions', (data.starttls && data.starttls.extensions ? data.starttls.extensions : data.ehlo.extensions).map(e => esc(e)).join('<br>') || '—') : ''}
            ${data.auth ? row('Login methods', data.auth.length ? data.auth.map(esc).join(', ') : 'none offered') : ''}
        </table></div>`;
        const c = data.starttls && data.starttls.certificate;
        if (c) {
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-lock"></i> STARTTLS certificate</div><table class="res-table">
                ${row('Protocol', esc(data.starttls.protocol || '—'))}${row('Cipher', esc(data.starttls.cipher || '—'))}
                ${row('Subject', esc(c.subject || '—'))}${row('Issuer', esc(c.issuer || '—'))}
                ${row('Valid to', `${esc(c.validTo || '—')}${c.daysLeft != null ? ` (${c.daysLeft} days)` : ''}`)}
                ${row('Trusted chain', c.trusted ? '✅ yes' : `❌ no${c.error ? ' — ' + esc(c.error) : ''}`)}
                ${c.hostnameMatch != null ? row('Name matches', c.hostnameMatch ? '✅ yes' : '❌ no') : ''}
            </table></div>`;
        }
        el.innerHTML = html + from(data);
    }

    function renderUptime(el, data) {
        let html = `<div class="badges">
            <span class="badge ${data.state === 'up' ? 'badge-green' : 'badge-red'}">${data.state === 'up' ? '🟢 Up' : '🔴 Down'}</span>
            ${data.status ? `<span class="badge">HTTP ${data.status} ${esc(data.statusText || '')}</span>` : ''}
            <span class="badge badge-cyan">⚡ ${data.ms}ms</span>
        </div>`;
        html += `<div class="card"><div class="card-head"><i class="fa-solid fa-heart-pulse"></i> ${esc(data.url)}</div><table class="res-table">
            ${data.error ? row('Problem', esc(data.error)) : ''}
            ${data.finalUrl && data.finalUrl !== data.url ? row('Ended at', esc(data.finalUrl)) : ''}
            ${data.redirects ? row('Redirects', (data.chain || []).map(h => `${h.status} ${esc(h.url)}`).join('<br>')) : ''}
            ${data.server ? row('Server', esc(data.server)) : ''}
            ${row('Checked at', esc(data.checkedAt || ''))}
        </table>${from(data)}</div>`;
        el.innerHTML = html;
    }

    function renderRobots(el, data) {
        let html = `<div class="badges">
            <span class="badge ${data.found ? 'badge-green' : 'badge-yellow'}">HTTP ${data.status}</span>
            <span class="badge badge-cyan">${esc(data.verdict || '')}</span>
            ${data.found ? `<span class="badge">${data.size} bytes</span>` : ''}
        </div>`;
        if (data.test) {
            const t = data.test;
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-vial"></i> ${esc(t.path)} as ${esc(t.ua)}</div>
                <p><span class="badge ${t.allowed ? 'badge-green' : 'badge-red'}">${t.allowed ? 'Allowed' : 'Blocked'}</span>
                ${t.rule ? ` by <code>${esc(t.rule.type)}: ${esc(t.rule.path)}</code> (line ${t.rule.line})` : ' (no rule matches)'}</p></div>`;
        }
        for (const w of data.warnings || []) html += `<div class="error-msg" style="margin-bottom:8px;text-align:left">${w.line ? `Line ${w.line}: ` : ''}${esc(w.text)}</div>`;
        for (const g of data.groups || []) {
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-robot"></i> User-agent: ${g.agents.map(esc).join(', ')}</div>
                <table class="res-table">${g.rules.map(r => `<tr><td class="key">${esc(r.type)}</td><td class="val">${esc(r.path) || '<span style="color:var(--text-muted)">(empty: allows everything)</span>'}</td></tr>`).join('') || '<tr><td class="val">No rules</td></tr>'}
                ${g.crawlDelay ? row('crawl-delay', esc(g.crawlDelay)) : ''}</table></div>`;
        }
        if ((data.sitemaps || []).length) html += `<div class="card"><div class="card-head"><i class="fa-solid fa-sitemap"></i> Sitemaps</div>${data.sitemaps.map(u => `<div class="raw-block">${esc(u)}</div>`).join('')}</div>`;
        el.innerHTML = html + from(data);
    }

    function renderSitemap(el, data) {
        const issues = data.issues || [];
        const errors = issues.filter(i => i.level === 'error');
        let html = `<div class="badges">
            <span class="badge ${data.valid ? 'badge-green' : 'badge-red'}">${data.valid ? 'Valid' : `${errors.length} problem${errors.length === 1 ? '' : 's'}`}</span>
            ${data.kind ? `<span class="badge badge-cyan">${data.kind === 'index' ? `Sitemap index: ${data.count} sitemaps` : `${Number(data.count).toLocaleString('en-US')} URLs`}</span>` : ''}
            <span class="badge">HTTP ${data.status}${data.gzip ? ' · gzip' : ''}</span>
        </div>`;
        html += `<p style="color:var(--text-muted);font-size:13px">${esc(data.finalUrl || data.url)}${data.source === 'robots.txt' ? ' (from robots.txt)' : data.source === 'default' ? ' (the default location)' : ''}</p>`;
        for (const i of issues) {
            html += `<div class="card"><div class="card-head"><span class="badge ${i.level === 'error' ? 'badge-red' : 'badge-yellow'}">${i.level}</span> ${esc(i.message)}${i.count > 1 ? ` (${i.count}×)` : ''}</div>
                ${i.examples && i.examples.length ? i.examples.map(x => `<div class="raw-block">${esc(x)}</div>`).join('') : ''}</div>`;
        }
        if ((data.sample || []).length) {
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-list"></i> First entries</div><table class="res-table">
                ${data.sample.map(u => `<tr><td class="val">${esc(u.loc)}</td><td class="val">${esc(u.lastmod || '')}</td></tr>`).join('')}</table></div>`;
        }
        if ((data.childResults || []).length) {
            html += `<div class="card"><div class="card-head"><i class="fa-solid fa-sitemap"></i> First ${data.childResults.length} of ${data.childrenTotal} sitemaps</div><table class="res-table">
                ${data.childResults.map(c => `<tr><td class="val">${esc(c.url)}</td><td>${c.error ? `<span class="badge badge-red">${esc(c.error)}</span>` : `<span class="badge ${c.valid ? 'badge-green' : 'badge-red'}">${c.valid ? 'valid' : 'problems'}</span> ${Number(c.count || 0).toLocaleString('en-US')} URLs`}</td></tr>`).join('')}</table></div>`;
        }
        el.innerHTML = html + from(data);
    }

    function renderLookup(el, data) {
        // Supertool: tabbed view
        const sections = [];
        if (data.ip) sections.push({ id: 'ip', label: 'IP / Geo', icon: 'fa-earth-americas' });
        if (data.dns) sections.push({ id: 'dns', label: 'DNS', icon: 'fa-sitemap' });
        if (data.rdap) sections.push({ id: 'rdap', label: 'RDAP / Whois', icon: 'fa-id-card' });
        if (data.ssl) sections.push({ id: 'ssl', label: 'SSL', icon: 'fa-lock' });
        if (data.headers) sections.push({ id: 'headers', label: 'Headers', icon: 'fa-list' });
        if (data.reverseDns) sections.push({ id: 'rdns', label: 'Reverse DNS', icon: 'fa-rotate-left' });

        // Badges
        let html = `<div class="badges">${(data.badges || []).map(b => `<span class="badge badge-cyan">${esc(b)}</span>`).join('')}</div>`;

        // Tabs
        html += `<div class="tabs">${sections.map((s, i) => `<button class="tab-btn ${i === 0 ? 'active' : ''}" onclick="switchTab('${s.id}', this)"><i class="fa-solid ${s.icon}"></i> ${s.label}</button>`).join('')}</div>`;

        // Tab contents
        if (data.ip) {
            const ip = data.ip;
            html += `<div class="tab-content ${sections[0]?.id === 'ip' ? 'active' : ''}" id="tab-ip">
                <div class="card"><div class="card-head"><i class="fa-solid fa-earth-americas"></i> IP / Geolocation</div>
                <table class="res-table">
                    <tr><td class="key">IP</td><td class="val">${esc(ip.address || '—')}</td></tr>
                    <tr><td class="key">Country</td><td class="val">${esc(ip.country || '—')} (${esc(ip.countryCode || '')})</td></tr>
                    <tr><td class="key">Region</td><td class="val">${esc(ip.region || '—')}</td></tr>
                    <tr><td class="key">City</td><td class="val">${esc(ip.city || '—')}</td></tr>
                    <tr><td class="key">Timezone</td><td class="val">${esc(ip.timezone || '—')}</td></tr>
                    <tr><td class="key">Coordinates</td><td class="val">${ip.lat != null ? `${ip.lat}, ${ip.lon}` : '—'}</td></tr>
                    <tr><td class="key">ISP</td><td class="val">${esc(ip.isp || '—')}</td></tr>
                    <tr><td class="key">Organization</td><td class="val">${esc(ip.org || '—')}</td></tr>
                    <tr><td class="key">AS</td><td class="val">${esc(ip.as || '—')}</td></tr>
                    <tr><td class="key">AS Name</td><td class="val">${esc(ip.asname || '—')}</td></tr>
                </table></div></div>`;
        }
        if (data.dns) {
            html += `<div class="tab-content" id="tab-dns">`;
            for (const [type, recs] of Object.entries(data.dns)) {
                if (!recs?.length) continue;
                html += `<div class="card"><div class="card-head"><i class="fa-solid fa-sitemap"></i> ${type}</div>`;
                if (type === 'MX') {
                    html += `<table class="res-table"><tr><th>Priority</th><th>Exchange</th></tr>${recs.map(r => `<tr><td class="val">${r.priority}</td><td class="val">${esc(r.exchange)}</td></tr>`).join('')}</table>`;
                } else if (type === 'TXT') {
                    html += `<div style="display:flex;flex-direction:column;gap:6px">${recs.map(r => `<div class="raw-block">${esc(Array.isArray(r) ? r.join('') : r)}</div>`).join('')}</div>`;
                } else {
                    html += `<div class="raw-block">${recs.map(r => esc(typeof r === 'object' ? JSON.stringify(r) : r)).join('\n')}</div>`;
                }
                html += `</div>`;
            }
            html += `</div>`;
        }
        if (data.rdap) {
            const r = data.rdap;
            html += `<div class="tab-content" id="tab-rdap"><div class="card"><div class="card-head"><i class="fa-solid fa-id-card"></i> RDAP / Whois</div>
                <table class="res-table">
                    <tr><td class="key">Name</td><td class="val">${esc(r.name || '—')}</td></tr>
                    ${(r.status || []).map(s => `<tr><td class="key">Status</td><td class="val">${esc(s)}</td></tr>`).join('')}
                    ${(r.events || []).map(e => `<tr><td class="key">${esc(e.action)}</td><td class="val">${esc(e.date)}</td></tr>`).join('')}
                    ${r.nameservers?.length ? `<tr><td class="key">Nameservers</td><td class="val">${r.nameservers.map(n => esc(n)).join('<br>')}</td></tr>` : ''}
                </table></div></div>`;
        }
        if (data.ssl) {
            const s = data.ssl;
            html += `<div class="tab-content" id="tab-ssl"><div class="card"><div class="card-head"><i class="fa-solid fa-lock"></i> SSL Certificate</div>
                <table class="res-table">
                    <tr><td class="key">Subject</td><td class="val">${esc(s.subject || '—')}</td></tr>
                    <tr><td class="key">Issuer</td><td class="val">${esc(s.issuer || '—')}</td></tr>
                    <tr><td class="key">Valid From</td><td class="val">${esc(s.validFrom || '—')}</td></tr>
                    <tr><td class="key">Valid To</td><td class="val">${esc(s.validTo || '—')}</td></tr>
                    <tr><td class="key">Days Left</td><td class="val">${s.daysLeft}</td></tr>
                    <tr><td class="key">Protocol</td><td class="val">${esc(s.protocol || '—')}</td></tr>
                    <tr><td class="key">SANs</td><td class="val">${s.sans?.length ? s.sans.map(x => esc(x)).join(', ') : '—'}</td></tr>
                </table></div></div>`;
        }
        if (data.headers) {
            const h = data.headers;
            html += `<div class="tab-content" id="tab-headers"><div class="card"><div class="card-head"><i class="fa-solid fa-list"></i> HTTP Response</div>
                <table class="res-table">
                    <tr><td class="key">Status</td><td class="val">${h.status} — ${h.ms}ms</td></tr>
                    ${h.server ? `<tr><td class="key">Server</td><td class="val">${esc(h.server)}</td></tr>` : ''}
                    ${Object.entries(h.headers || {}).map(([k, v]) => `<tr><td class="key">${esc(k)}</td><td class="val">${esc(v)}</td></tr>`).join('')}
                </table></div></div>`;
        }
        if (data.reverseDns) {
            const r = data.reverseDns;
            html += `<div class="tab-content" id="tab-rdns"><div class="card"><div class="card-head"><i class="fa-solid fa-rotate-left"></i> Reverse DNS</div>
                <table class="res-table">
                    <tr><td class="key">IP</td><td class="val">${esc(r.ip || '—')}</td></tr>
                    <tr><td class="key">Hostnames</td><td class="val">${r.hostnames?.length ? r.hostnames.map(h => esc(h)).join('<br>') : 'No PTR record'}</td></tr>
                </table></div></div>`;
        }

        el.innerHTML = html;
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const tab = document.getElementById(`tab-${id}`);
        if (tab) tab.classList.add('active');
    }

    // ── Utility functions ────────────────────────────────────
    function esc(s) {
        if (s == null) return '';
        const d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
    }

    function copyText(text) {
        navigator.clipboard.writeText(text).then(() => toast('Copied!', 'info')).catch(() => {});
    }

    function goLookup(target) {
        location.href = `https://lookup.openvibe.tools?q=${encodeURIComponent(target)}`;
    }

    function goToolWithTarget(toolId, target) {
        location.href = `https://${toolId}.openvibe.tools?q=${encodeURIComponent(target)}`;
    }

    function toast(msg, type = 'info') {
        const container = document.getElementById('toasts');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }
    </script>
  <script src="https://openvibe.live/live-notify.js" async></script>
</body>
</html>
