<!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and above the stylesheets.
     Paints the cached theme synchronously so the default palette never flashes. Reads
     localStorage only: no network, nothing to block on. theme-loader.js still runs after
     and reconciles with the account. -->
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://openvibe.network/shared/theme-loader.js"></script>
    <style>
        :root {
            --bg-primary: #0b0c12;
            --bg-secondary: #12131c;
            --bg-tertiary: #1a1b28;
            --bg-card: rgba(22, 24, 36, 0.85);
            --bg-hover: #252738;
            --bg-input: #181926;
            --text-primary: #f1f4fb;
            --text-secondary: #a0a8c4;
            --text-muted: #5e6580;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-dark: #6d28d9;
            --border: rgba(255,255,255,0.07);
            --border-light: rgba(255,255,255,0.12);
            --shadow: 0 24px 64px rgba(0,0,0,0.4);
            --radius: 16px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-primary); scroll-behavior: smooth; }
        body { min-height: 100vh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { text-align: center; padding: 60px 20px; position: relative; }
        header::before { content: ''; position: absolute; top: 50%; left: 50%; width: 600px; height: 600px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(139,92,246,0.08), transparent 70%); pointer-events: none; z-index: -1; }
        h1 { font-size: 3rem; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 16px; background: linear-gradient(135deg, var(--accent-light), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto 32px; }
        
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        #showcase-section { display: none; padding: 40px 0; }
        #showcase-section.visible { display: block; }
        
        .showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; margin: 40px 0; max-width: 800px; margin-left: auto; margin-right: auto; }
        .showcase-tool { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-radius: 16px; background: var(--bg-card); border: 1px solid var(--border-light); cursor: pointer; transition: all 0.3s ease; gap: 10px; animation: float ease-in-out infinite; }
        .showcase-tool:nth-child(1) { animation-delay: 0s; animation-duration: 3s; }
        .showcase-tool:nth-child(2) { animation-delay: 0.15s; animation-duration: 3.3s; }
        .showcase-tool:nth-child(3) { animation-delay: 0.3s; animation-duration: 3.6s; }
        .showcase-tool:nth-child(4) { animation-delay: 0.45s; animation-duration: 3.2s; }
        .showcase-tool:nth-child(5) { animation-delay: 0.6s; animation-duration: 3.4s; }
        .showcase-tool:nth-child(6) { animation-delay: 0.75s; animation-duration: 3.1s; }
        .showcase-tool:nth-child(7) { animation-delay: 0.9s; animation-duration: 3.5s; }
        .showcase-tool:nth-child(8) { animation-delay: 1.05s; animation-duration: 3.3s; }
        .showcase-tool:hover { transform: translateY(-4px); border-color: rgba(139,92,246,0.5); box-shadow: 0 16px 36px rgba(139,92,246,0.2); }
        .showcase-tool-icon { font-size: 1.8rem; color: var(--accent-light); }
        .showcase-tool-label { font-size: 0.8rem; font-weight: 700; text-align: center; color: var(--text-secondary); }
        
        .quick-examples { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 32px 0; max-width: 800px; margin-left: auto; margin-right: auto; }
        .example-btn { padding: 12px 16px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); text-align: center; text-decoration: none; color: var(--text-secondary); font-size: 0.8rem; font-weight: 700; transition: all 0.25s ease; animation: fadeInScale 0.5s ease both; cursor: pointer; }
        .example-btn:nth-child(1) { animation-delay: 0.1s; }
        .example-btn:nth-child(2) { animation-delay: 0.2s; }
        .example-btn:nth-child(3) { animation-delay: 0.3s; }
        .example-btn:nth-child(4) { animation-delay: 0.4s; }
        .example-btn:hover { border-color: rgba(139,92,246,0.4); color: var(--accent-light); background: rgba(139,92,246,0.08); }
        
        .stats-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 32px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .stat-card { padding: 16px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); text-align: center; animation: fadeInScale 0.6s ease both; }
        .stat-card:nth-child(1) { animation-delay: 0.2s; }
        .stat-card:nth-child(2) { animation-delay: 0.3s; }
        .stat-card:nth-child(3) { animation-delay: 0.4s; }
        .stat-card:nth-child(4) { animation-delay: 0.5s; }
        .stat-card-value { font-size: 1.3rem; font-weight: 900; color: var(--accent-light); }
        .stat-card-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
        
        .search-wrapper { max-width: 600px; margin: 0 auto 32px; }
        .search-wrapper input { width: 100%; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border-light); background: var(--bg-card); color: var(--text-primary); font-family: inherit; font-size: 0.95rem; outline: none; transition: all 0.25s ease; }
        .search-wrapper input:focus { border-color: rgba(139,92,246,0.4); background: var(--bg-hover); }
        
        .note { text-align: center; padding: 40px 20px 0; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border); margin-top: 60px; }
        footer a { color: var(--accent-light); text-decoration: none; }
        footer a:hover { text-decoration: underline; }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .showcase-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
            .quick-examples { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stats-section { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="navbar-mount"></div>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-images"></i> Img.OpenVibe</h1>
            <p class="subtitle">Online image tools. Convert, compress, resize, crop, edit, and more. PNG, JPG, WebP, AVIF, GIF, TIFF, BMP, and 30+ formats supported.</p>
        </header>
        
        <div id="showcase-section">
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search image tools..." onkeyup="filterShowcase()">
            </div>
            
            <div class="showcase-grid" id="showcase-grid"></div>
            
            <div class="quick-examples" id="quick-examples"></div>
            
            <div class="stats-section" id="stats"></div>
        </div>
        
        <p class="note">All image processing is performed locally in your browser. No files are uploaded to our servers.</p>
    </div>
    <div id="ov-footer"></div>
    
    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script>
        const IMAGE_TOOLS = {
            'convert': { name: 'Converter', domain: 'convert.openvibe.tools', icon: 'fa-arrow-right-arrow-left', category: 'Convert' },
            'compress': { name: 'Compress', domain: 'compress.openvibe.tools', icon: 'fa-compress', category: 'Optimize' },
            'resize': { name: 'Resize', domain: 'resize.openvibe.tools', icon: 'fa-expand', category: 'Resize' },
            'crop': { name: 'Crop', domain: 'crop.openvibe.tools', icon: 'fa-crop', category: 'Edit' },
            'png': { name: 'PNG', domain: 'png.openvibe.tools', icon: 'fa-image', category: 'Format' },
            'jpg': { name: 'JPG', domain: 'jpg.openvibe.tools', icon: 'fa-image', category: 'Format' },
            'webp': { name: 'WebP', domain: 'webp.openvibe.tools', icon: 'fa-image', category: 'Format' },
            'favicon': { name: 'Favicon', domain: 'favicon.openvibe.tools', icon: 'fa-star', category: 'Special' },
        };
        
        function buildShowcaseGrid() {
            const showcase = document.getElementById('showcase-grid');
            if (!showcase) return;
            const popular = Object.keys(IMAGE_TOOLS);
            showcase.innerHTML = popular.map(id => {
                const t = IMAGE_TOOLS[id];
                return `<a href="https://${t.domain}" class="showcase-tool" title="${t.name}" target="_blank" rel="noopener">
                    <i class="fa-solid ${t.icon} showcase-tool-icon"></i>
                    <span class="showcase-tool-label">${t.name}</span>
                </a>`;
            }).join('');
        }
        
        function buildQuickExamples() {
            const examples = document.getElementById('quick-examples');
            if (!examples) return;
            examples.innerHTML = `
                <button class="example-btn" onclick="goTool('convert')">Convert Now</button>
                <button class="example-btn" onclick="goTool('compress')">Compress Demo</button>
                <button class="example-btn" onclick="goTool('resize')">Resize Now</button>
                <button class="example-btn" onclick="goTool('crop')">Crop Demo</button>
            `;
        }
        
        function buildStats() {
            const stats = document.getElementById('stats');
            if (!stats) return;
            stats.innerHTML = `
                <div class="stat-card"><div class="stat-card-value">30+</div><div class="stat-card-label">Formats</div></div>
                <div class="stat-card"><div class="stat-card-value">0%</div><div class="stat-card-label">Login</div></div>
                <div class="stat-card"><div class="stat-card-value">∞</div><div class="stat-card-label">Open</div></div>
                <div class="stat-card"><div class="stat-card-value">⚡</div><div class="stat-card-label">Fast</div></div>
            `;
        }
        
        function goTool(toolId) {
            if (IMAGE_TOOLS[toolId]) window.open('https://' + IMAGE_TOOLS[toolId].domain, '_blank');
        }
        
        function filterShowcase() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.showcase-tool').forEach(card => {
                const label = card.getAttribute('title').toLowerCase();
                card.style.display = label.includes(query) ? '' : 'none';
            });
        }
        
        // Initialize
        function getCookie(n) {
            const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : null;
        }
        function initChrome() {
            const token = getCookie('ov_token') || localStorage.getItem('ov_token');
            if (window.OpenVibeNavbar) {
                try {
                    OpenVibeNavbar.init({
                        service: 'img', apiBase: 'https://openvibe.network', token,
                        history: { type: 'tool', title: document.title.split(' — ')[0] },
                        silentLogin: 'https://openvibe.tools/auth/login?silent=1&next={url}',
                    });
                } catch { /* non-critical */ }
            }
            if (window.OpenVibeFooter) {
                try {
                    const items = Object.values(IMAGE_TOOLS).map(t => ({ name: t.name, url: 'https://' + t.domain }));
                    OpenVibeFooter.init({
                        service: 'img', variant: 'full', mount: '#ov-footer', apiBase: 'https://openvibe.network',
                        links: [
                            { heading: 'Tools', items: items.slice(0, Math.ceil(items.length / 2)) },
                            { heading: 'Formats', items: items.slice(Math.ceil(items.length / 2)) },
                        ],
                    });
                } catch { /* non-critical */ }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initChrome();
            const showcase = document.getElementById('showcase-section');
            showcase.style.display = 'block';
            buildShowcaseGrid();
            buildQuickExamples();
            buildStats();
        });
    </script>
  <script src="https://openvibe.live/live-notify.js" async></script>
</body>
