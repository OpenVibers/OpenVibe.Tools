<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Img.OpenVibe — Online Image Converter & Tools</title>
<link rel="icon" type="image/svg+xml" data-ov-icon="tools" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-32%20-32%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22ring%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2338bdf8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232563eb%22%2F%3E%3C%2FlinearGradient%3E%0A%3CradialGradient%20id%3D%22glow%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2338bdf8%22%20stop-opacity%3D%22.34%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2338bdf8%22%20stop-opacity%3D%220%22%2F%3E%3C%2FradialGradient%3E%0A%3CradialGradient%20id%3D%22bg%22%20cx%3D%22.5%22%20cy%3D%22.38%22%20r%3D%22.8%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2316223a%22%2F%3E%3Cstop%20offset%3D%22.6%22%20stop-color%3D%22%230a0f1c%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23060912%22%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%22-32%22%20y%3D%22-32%22%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22url(%23bg)%22%2F%3E%3Cg%20transform%3D%22scale(1.22)%22%3E%0A%3Ccircle%20r%3D%2221%22%20fill%3D%22url(%23glow)%22%2F%3E%0A%3Ccircle%20r%3D%2218%22%20fill%3D%22none%22%20stroke%3D%22url(%23ring)%22%20stroke-width%3D%224%22%20opacity%3D%22.38%22%2F%3E%0A%3Cpath%20d%3D%22M0%2C-18%20A18%2C18%200%200%2C1%2017.4%2C4.6%22%20fill%3D%22none%22%20stroke%3D%22url(%23ring)%22%20stroke-width%3D%224.4%22%20stroke-linecap%3D%22round%22%2F%3E%0A%3Cpath%20d%3D%22M-9.5%2C-7%20L0%2C10%20L9.5%2C-7%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3Ccircle%20cx%3D%2217.4%22%20cy%3D%224.6%22%20r%3D%223.2%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#0d131d">
<meta name="color-scheme" content="dark light">
    <meta name="description" content="Convert, compress, resize, and crop images online. Supports PNG, JPG, WebP, AVIF, HEIC, SVG, GIF, ICO, TIFF, BMP and more.">
    <meta property="og:title" content="Img.OpenVibe — Online Image Converter & Tools">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and above the stylesheets.
     Paints the cached theme synchronously so the default palette never flashes. Reads
     localStorage only: no network, nothing to block on. theme-loader.js still runs after
     and reconciles with the account. -->
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar injected by OpenVibeNavbar.init() -->

    <div id="app">
        <!-- Hero -->
        <section class="hero" id="hero">
            <div class="hero-icon" id="hero-icon"><i class="fa-solid fa-images"></i></div>
            <h1 id="hero-title">Img.OpenVibe</h1>
            <p class="hero-subtitle" id="hero-subtitle">Online Image Converter & Tools</p>
        </section>

        <!-- Tool Selector (visible on hub domain) -->
        <nav class="tool-tabs" id="tool-tabs">
            <button class="tool-tab active" data-tool="convert"><i class="fa-solid fa-arrows-rotate"></i> Convert</button>
            <button class="tool-tab" data-tool="compress"><i class="fa-solid fa-compress"></i> Compress</button>
            <button class="tool-tab" data-tool="resize"><i class="fa-solid fa-up-right-and-down-left-from-center"></i> Resize</button>
            <button class="tool-tab" data-tool="crop"><i class="fa-solid fa-crop-simple"></i> Crop</button>
        </nav>

        <!-- Upload Zone -->
        <section class="upload-zone" id="upload-zone">
            <div class="upload-area" id="upload-area">
                <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                <p class="upload-text">Drag & drop an image here</p>
                <p class="upload-hint">or click to browse — PNG, JPG, WebP, AVIF, HEIC, SVG, GIF, ICO, TIFF, BMP</p>
                <input type="file" id="file-input" accept="image/*" hidden>
                <button class="btn btn-primary" id="browse-btn"><i class="fa-solid fa-folder-open"></i> Choose File</button>
            </div>
            <div class="upload-info" id="upload-info" style="display:none">
                <div class="file-preview" id="file-preview"></div>
                <div class="file-details" id="file-details"></div>
                <button class="btn btn-ghost" id="clear-btn"><i class="fa-solid fa-xmark"></i> Clear</button>
            </div>
        </section>

        <!-- Tool Options -->
        <section class="options-panel" id="options-panel" style="display:none">
            <!-- Convert Options -->
            <div class="option-group" id="opt-convert">
                <label class="option-label">Output Format</label>
                <div class="format-grid" id="format-grid">
                    <button class="format-btn" data-format="png">PNG</button>
                    <button class="format-btn" data-format="jpg">JPG</button>
                    <button class="format-btn" data-format="webp">WebP</button>
                    <button class="format-btn" data-format="avif">AVIF</button>
                    <button class="format-btn" data-format="gif">GIF</button>
                    <button class="format-btn" data-format="tiff">TIFF</button>
                    <button class="format-btn" data-format="bmp">BMP</button>
                    <button class="format-btn" data-format="ico">ICO</button>
                </div>
                <label class="option-label">Quality <span id="quality-val">80</span>%</label>
                <input type="range" id="quality-slider" min="1" max="100" value="80" class="slider">
            </div>

            <!-- Compress Options -->
            <div class="option-group" id="opt-compress" style="display:none">
                <label class="option-label">Compression Level <span id="compress-val">75</span>%</label>
                <input type="range" id="compress-slider" min="1" max="100" value="75" class="slider">
                <p class="option-hint">Lower = smaller file size, higher = better quality</p>
            </div>

            <!-- Resize Options -->
            <div class="option-group" id="opt-resize" style="display:none">
                <div class="dimension-inputs">
                    <div class="dim-field">
                        <label class="option-label">Width (px)</label>
                        <input type="number" id="resize-w" class="num-input" placeholder="auto" min="1" max="16384">
                    </div>
                    <span class="dim-x"><i class="fa-solid fa-xmark"></i></span>
                    <div class="dim-field">
                        <label class="option-label">Height (px)</label>
                        <input type="number" id="resize-h" class="num-input" placeholder="auto" min="1" max="16384">
                    </div>
                </div>
                <label class="option-label">Or scale by percentage</label>
                <input type="number" id="resize-pct" class="num-input num-input-sm" placeholder="e.g. 50" min="1" max="1000"> %
                <label class="option-label">Fit Mode</label>
                <select id="resize-fit" class="select-input">
                    <option value="inside" selected>Inside (fit within bounds)</option>
                    <option value="cover">Cover (fill & crop)</option>
                    <option value="contain">Contain (fit with padding)</option>
                    <option value="fill">Fill (stretch)</option>
                    <option value="outside">Outside (cover minimum)</option>
                </select>
            </div>

            <!-- Crop Options -->
            <div class="option-group" id="opt-crop" style="display:none">
                <label class="option-label">Aspect Ratio Preset</label>
                <div class="aspect-grid" id="aspect-grid">
                    <button class="aspect-btn" data-aspect="1:1">1:1</button>
                    <button class="aspect-btn" data-aspect="16:9">16:9</button>
                    <button class="aspect-btn" data-aspect="4:3">4:3</button>
                    <button class="aspect-btn" data-aspect="3:2">3:2</button>
                    <button class="aspect-btn" data-aspect="21:9">21:9</button>
                    <button class="aspect-btn" data-aspect="9:16">9:16</button>
                    <button class="aspect-btn" data-aspect="3:4">3:4</button>
                    <button class="aspect-btn active" data-aspect="">Custom</button>
                </div>
                <div class="crop-coords" id="crop-coords">
                    <div class="dim-field"><label class="option-label">Left</label><input type="number" id="crop-left" class="num-input" placeholder="0" min="0"></div>
                    <div class="dim-field"><label class="option-label">Top</label><input type="number" id="crop-top" class="num-input" placeholder="0" min="0"></div>
                    <div class="dim-field"><label class="option-label">Width</label><input type="number" id="crop-w" class="num-input" placeholder="auto" min="1"></div>
                    <div class="dim-field"><label class="option-label">Height</label><input type="number" id="crop-h" class="num-input" placeholder="auto" min="1"></div>
                </div>
            </div>

            <!-- Process Button -->
            <button class="btn btn-primary btn-lg" id="process-btn" disabled>
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="process-text">Process Image</span>
            </button>
        </section>

        <!-- Processing State -->
        <section class="processing" id="processing" style="display:none">
            <div class="spinner"></div>
            <p>Processing your image...</p>
        </section>

        <!-- Result -->
        <section class="result-panel" id="result-panel" style="display:none">
            <h2><i class="fa-solid fa-circle-check"></i> Done!</h2>
            <div class="result-preview" id="result-preview"></div>
            <div class="result-info" id="result-info"></div>
            <div class="result-actions">
                <a class="btn btn-primary btn-lg" id="download-btn" href="#" download>
                    <i class="fa-solid fa-download"></i> Download
                </a>
                <button class="btn btn-secondary" id="another-btn">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Process Another
                </button>
            </div>
        </section>

        <!-- Format Subdomains Grid (hub only) -->
        <section class="subdomains" id="subdomains">
            <h2>All Image Tools</h2>
            <div class="subdomain-grid" id="subdomain-grid"></div>
        </section>
    </div>

    <!-- Footer -->
    <div id="ov-footer"></div>

    <script src="https://openvibe.network/shared/theme-loader.js" defer></script>
    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
