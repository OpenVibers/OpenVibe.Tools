# ═══════════════════════════════════════════════════════════════
# food.openvibe.tools — Nginx Configuration
# Proxy to openvibe-food Node.js server on port 4011
# Uses existing *.openvibe.tools wildcard TLS cert
# ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=openvibefood_api:10m rate=10r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name food.openvibe.tools;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name food.openvibe.tools;

    ssl_certificate     /etc/letsencrypt/live/openvibe.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.tools/privkey.pem;

    access_log /var/log/nginx/food.openvibe.tools.access.log;
    error_log  /var/log/nginx/food.openvibe.tools.error.log;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API (rate limited) ──────────────────────────────────
    location /api/ {
        limit_req zone=openvibefood_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static / SPA ────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
