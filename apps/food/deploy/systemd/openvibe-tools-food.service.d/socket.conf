# Bind the service to the socket unit that owns its listener. A drop-in, so the main unit stays usable on a box that
# has not been switched over to socket activation.
[Unit]
Requires=openvibe-tools-food.socket
After=openvibe-tools-food.socket

[Service]
# Node's libuv expects a non-blocking descriptor. (A [Service] option: in [Socket] systemd ignores it.)
NonBlocking=true
