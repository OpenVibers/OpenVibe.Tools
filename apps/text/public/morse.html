<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Translator | morse.openvibe.tools</title>
    <meta name="description" content="Translate text to Morse code and back. Dots and dashes for your inner telegraph operator.">
    <meta name="theme-color" content="#0b0c12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and above the stylesheets.
     Paints the cached theme synchronously so the default palette never flashes. Reads
     localStorage only: no network, nothing to block on. theme-loader.js still runs after
     and reconciles with the account. -->
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/shared.css">
    <script src="https://openvibe.network/shared/theme-loader.js"></script>
</head>
<body>
    <div class="tool-wrap">
        <div class="page-header">
            <h1><i class="fas fa-signal"></i> Morse Code</h1>
            <p class="subtitle">Translate between text and Morse code ·· — both directions.</p>
        </div>

        <div class="tool-section">
            <div class="pill-tabs">
                <button class="pill-tab active" id="tabEncode" onclick="setMode('encode')">Text → Morse</button>
                <button class="pill-tab" id="tabDecode" onclick="setMode('decode')">Morse → Text</button>
            </div>
            <div class="input-group">
                <label id="inputLabel">Text</label>
                <textarea id="input" class="large" placeholder="Type your text..." autofocus>SOS</textarea>
            </div>
            <div class="live-hint"><span class="live-dot"></span> Results update as you type</div>
            <div class="generate-row">
                <button class="btn btn-primary generate-btn" onclick="document.querySelector('#input, textarea').dispatchEvent(new Event('input', {bubbles:true}))"><i class="fas fa-bolt"></i> Generate</button>
            </div>
        </div>

        <div class="tool-section">
            <h2><i class="fas fa-terminal"></i> Output</h2>
            <div id="output" class="output-box mono" style="font-size: 1.2rem; letter-spacing: 0.15em;"></div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="OpenVibeUI.copyText(document.getElementById('output').textContent)"><i class="fas fa-copy"></i> Copy</button>
            </div>
        </div>

        <div id="ov-footer" data-related="Binary|https://binary.openvibe.tools;Fancy Text|https://fancy.openvibe.tools"></div>
    </div>

    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="/js/text-engine.js"></script>
    <script src="/js/shared.js"></script>
    <script>
        OpenVibeUI.initPage();
        let mode = 'encode';
        function setMode(m) {
            mode = m;
            document.getElementById('tabEncode').classList.toggle('active', m === 'encode');
            document.getElementById('tabDecode').classList.toggle('active', m === 'decode');
            document.getElementById('inputLabel').textContent = m === 'encode' ? 'Text' : 'Morse Code';
            document.getElementById('input').placeholder = m === 'encode' ? 'Type your text...' : 'Enter morse code (dots and dashes)...';
            update();
        }
        function update() {
            const text = document.getElementById('input').value;
            document.getElementById('output').textContent = mode === 'encode' ? TextOpenVibeEngine.toMorse(text) : TextOpenVibeEngine.fromMorse(text);
        }
        document.getElementById('input').addEventListener('input', update);
        update();
    </script>
</body>
</html>
