<!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and above the stylesheets.
     Paints the cached theme synchronously so the default palette never flashes. Reads
     localStorage only: no network, nothing to block on. theme-loader.js still runs after
     and reconciles with the account. -->
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/shared.css">
    <script src="https://openvibe.network/shared/theme-loader.js" defer></script>
</head>
<body>
    <div class="tool-wrap" style="max-width: 1000px;">
        <div class="page-header">
            <h1><i class="fas fa-icons"></i> Symbols & Special Characters</h1>
            <p class="subtitle">Click any symbol to copy it to your clipboard instantly.</p>
        </div>

        <!-- Collected symbols -->
        <div class="input-group" style="margin-bottom: 24px;">
            <label>Your collected symbols (click to copy all)</label>
            <div id="collected" class="output-box mono" style="min-height: 44px; cursor: pointer; font-size: 1.4rem; letter-spacing: 0.3em;" onclick="OpenVibeUI.copyText(this.textContent)"></div>
            <div class="btn-row">
                <button class="btn btn-ghost btn-sm" onclick="clearCollected()"><i class="fas fa-xmark"></i> Clear</button>
                <button class="btn btn-ghost btn-sm" onclick="OpenVibeUI.copyText(document.getElementById('collected').textContent)"><i class="fas fa-copy"></i> Copy All</button>
            </div>
        </div>

        <div id="categories"></div>

        <div id="ov-footer" data-related="Kaomoji|https://kaomoji.openvibe.tools;Fancy Text|https://fancy.openvibe.tools;Unicode Inspector|https://unicode.openvibe.tools"></div>
    </div>

    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="/js/text-engine.js"></script>
    <script src="/js/shared.js"></script>
    <script>
        OpenVibeUI.initPage();
        const categories = document.getElementById('categories');
        const collected = document.getElementById('collected');

        const categoryIcons = {
            arrows: 'fa-right-long', stars: 'fa-star', hearts: 'fa-heart', music: 'fa-music',
            math: 'fa-superscript', currency: 'fa-dollar-sign', bullets: 'fa-list',
            boxes: 'fa-square', lines: 'fa-grip-lines', dividers: 'fa-minus',
            check: 'fa-check', zodiac: 'fa-star-of-david', weather: 'fa-cloud-sun',
            gaming: 'fa-chess', hands: 'fa-hand', faces: 'fa-face-smile',
        };

        for (const [name, syms] of Object.entries(TextOpenVibeEngine.symbols)) {
            const section = document.createElement('div');
            section.className = 'tool-section';
            const icon = categoryIcons[name] || 'fa-hashtag';
            section.innerHTML = `<h2><i class="fas ${icon}"></i> ${name.charAt(0).toUpperCase() + name.slice(1)}</h2>`;
            const grid = document.createElement('div');
            grid.className = 'symbol-grid';

            syms.forEach(sym => {
                const btn = document.createElement('button');
                btn.className = 'symbol-btn';
                btn.textContent = sym;
                btn.title = `Copy "${sym}"`;
                btn.addEventListener('click', () => {
                    OpenVibeUI.copyText(sym, btn);
                    collected.textContent += sym;
                });
                grid.appendChild(btn);
            });

            section.appendChild(grid);
            categories.appendChild(section);
        }

        function clearCollected() {
            collected.textContent = '';
        }
    </script>
</body>
</html>
