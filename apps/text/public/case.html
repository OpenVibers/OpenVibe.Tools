<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();

<body>
    <div class="tool-wrap">
        <div class="page-header">
            <h1><i class="fas fa-text-slash"></i> Case Converter</h1>
            <p class="subtitle">Instantly convert text between 14 different case styles. Click any result to copy.</p>
        </div>

        <div class="tool-section">
            <div class="input-group">
                <textarea id="input" class="large" placeholder="Type or paste your text here..." autofocus>the quick brown fox jumps over the lazy dog</textarea>
            </div>
            <div class="live-hint"><span class="live-dot"></span> Results update as you type</div>
            <div class="generate-row">
                <button class="btn btn-primary generate-btn" onclick="document.querySelector('#input, textarea').dispatchEvent(new Event('input', {bubbles:true}))"><i class="fas fa-bolt"></i> Generate</button>
            </div>
        </div>

        <div id="output" class="output-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>

        <div id="ov-footer" data-related="Fancy Text|https://fancy.openvibe.tools;Text Cleaner|https://clean.openvibe.tools;Text Counter|https://count.openvibe.tools"></div>
    </div>

    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="/js/text-engine.js"></script>
    <script src="/js/shared.js"></script>
    <script>
        OpenVibeUI.initPage();
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const caseNames = {
            upper: 'UPPERCASE', lower: 'lowercase', title: 'Title Case',
            sentence: 'Sentence case', capitalize: 'Capitalize Words',
            inverse: 'iNVERSE cASE', alternating: 'aLtErNaTiNg', mocking: 'mOcKiNg CaSe',
            snake: 'snake_case', camel: 'camelCase', pascal: 'PascalCase',
            kebab: 'kebab-case', constant: 'CONSTANT_CASE', dot: 'dot.case',
        };
        const cards = {};

        function updateAll() {
            const text = input.value || '';
            if (!text.trim()) {
                output.innerHTML = '<div style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 40px;">Type or paste text above...</div>';
                return;
            }
            if (Object.keys(cards).length === 0) {
                output.innerHTML = '';
                for (const [key, name] of Object.entries(caseNames)) {
                    cards[key] = OpenVibeUI.createOutputCard(name, TextOpenVibeEngine.case[key](text), output);
                }
            } else {
                for (const [key, name] of Object.entries(caseNames)) {
                    if (cards[key]) OpenVibeUI.updateOutputCard(cards[key], TextOpenVibeEngine.case[key](text));
                }
            }
        }

        input.addEventListener('input', updateAll);
        updateAll();
    </script>
</body>
