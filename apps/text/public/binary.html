<body>
    <div class="tool-wrap">
        <div class="page-header">
            <h1><i class="fas fa-microchip"></i> Binary & Hex Converter</h1>
            <p class="subtitle">Convert text to binary, hex, decimal, and back.</p>
        </div>

        <div class="tool-section">
            <div class="input-group">
                <label>Text</label>
                <textarea id="input" class="large" placeholder="Type your text..." autofocus>Hello</textarea>
            </div>
            <div class="live-hint"><span class="live-dot"></span> Results update as you type</div>
            <div class="generate-row">
                <button class="btn btn-primary generate-btn" onclick="document.querySelector('#input, textarea').dispatchEvent(new Event('input', {bubbles:true}))"><i class="fas fa-bolt"></i> Generate</button>
            </div>
        </div>

        <div id="output" class="output-grid" style="grid-template-columns: 1fr;"></div>

        <div class="tool-section">
            <h2><i class="fas fa-rotate-left"></i> Decode Binary</h2>
            <div class="input-group">
                <textarea id="binInput" class="mono" placeholder="Paste binary (space-separated bytes)..." rows="2"></textarea>
            </div>
            <div id="binOutput" class="output-box" style="display:none;"></div>
        </div>

        <div id="ov-footer" data-related="Morse Code|https://morse.openvibe.tools;Escape / Unescape|https://escape.openvibe.tools"></div>
    </div>

    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="/js/text-engine.js"></script>
    <script src="/js/shared.js"></script>
    <script>
        OpenVibeUI.initPage();
        const output = document.getElementById('output');


        const cards = {};
        const formats = [
            { key: 'binary', name: 'Binary', fn: TextOpenVibeEngine.toBinary },
            { key: 'hex', name: 'Hexadecimal', fn: TextOpenVibeEngine.toHex },
            { key: 'decimal', name: 'Decimal', fn: TextOpenVibeEngine.toDecimal },
            { key: 'octal', name: 'Octal', fn: TextOpenVibeEngine.toOctal },
        ];

        function update() {
            const text = document.getElementById('input').value;
            if (!text) { output.innerHTML = ''; return; }
            if (Object.keys(cards).length === 0) {
                output.innerHTML = '';
                formats.forEach(f => {
                    cards[f.key] = OpenVibeUI.createOutputCard(f.name, f.fn(text), output);
                    cards[f.key].querySelector('.style-text').classList.add('mono');
                    cards[f.key].querySelector('.style-text').style.fontSize = '0.9rem';
                });
            } else {
                formats.forEach(f => { if (cards[f.key]) OpenVibeUI.updateOutputCard(cards[f.key], f.fn(text)); });
            }
        }

        document.getElementById('input').addEventListener('input', update);
        update();

        document.getElementById('binInput').addEventListener('input', function() {
            const out = document.getElementById('binOutput');
            if (this.value.trim()) {
                out.style.display = 'block';
                out.textContent = TextOpenVibeEngine.fromBinary(this.value);
            } else {
                out.style.display = 'none';
            }
        });
    </script>
</body>
