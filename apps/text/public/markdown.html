    <script>
        OpenVibeUI.initPage();

        const parseMd = FormatOpenVibeEngine.markdownToHtml;
        function update() {
            document.getElementById('preview').innerHTML = parseMd(document.getElementById('input').value);
        }

        function copyHtml() {
            OpenVibeUI.copyText(parseMd(document.getElementById('input').value));
        }

        document.getElementById('input').addEventListener('input', update);
        update();
    </script>
