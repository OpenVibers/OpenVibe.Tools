<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Slug Generator | slug.openvibe.tools</title>
    <meta name="description" content="Convert titles into URL-friendly slugs. Strip diacritics, normalize whitespace, clean special characters.">
    <meta name="theme-color" content="#0b0c12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and above the stylesheets.
     Paints the cached theme synchronously so the default palette never flashes. Reads
     localStorage only: no network, nothing to block on. theme-loader.js still runs after
     and reconciles with the account. -->
<script>
(function(){try{var raw=localStorage.getItem('ov_theme');if(!raw)return;var t=JSON.parse(raw),v=t&&t.variables;if(!v)return;var el=document.documentElement;for(var k in v)if(k.charAt(0)==='-')el.style.setProperty(k,v[k]);if(t.id)el.setAttribute('data-theme',t.id);}catch(_){}})();
</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/shared.css">
    <script src="https://openvibe.network/shared/theme-loader.js"></script>
</head>
<body>
    <div class="tool-wrap">
        <div class="page-header">
            <h1><i class="fas fa-link"></i> Slug Generator</h1>
            <p class="subtitle">Convert titles and text into clean, URL-friendly slugs.</p>
        </div>

        <div class="tool-section">
            <div class="input-group">
                <label>Title / Text</label>
                <input type="text" id="input" value="Hello World! This is a Test — With Special Characters & Stuff" placeholder="Enter a title..." autofocus>
            </div>
            <div class="live-hint"><span class="live-dot"></span> Results update as you type</div>
            <div class="generate-row">
                <button class="btn btn-primary generate-btn" onclick="document.querySelector('#input, input[type=text]').dispatchEvent(new Event('input', {bubbles:true}))"><i class="fas fa-bolt"></i> Generate</button>
            </div>
        </div>

        <div class="tool-section">
            <h2><i class="fas fa-link"></i> Slug</h2>
            <div id="output" class="output-box mono" style="font-size: 1.1rem; cursor: pointer;" onclick="OpenVibeUI.copyText(this.textContent)"></div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="OpenVibeUI.copyText(document.getElementById('output').textContent)"><i class="fas fa-copy"></i> Copy</button>
            </div>
        </div>

        <div id="ov-footer" data-related="Case Converter|https://case.openvibe.tools;Text Cleaner|https://clean.openvibe.tools"></div>
    </div>

    <script src="https://openvibe.network/shared/navbar.js"></script>
    <script src="https://openvibe.network/shared/footer.js"></script>
    <script src="https://openvibe.network/shared/notification-ui.js"></script>
    <script src="https://openvibe.network/shared/account-switcher.js"></script>
    <script src="/js/text-engine.js"></script>
    <script src="/js/shared.js"></script>
    <script>
        OpenVibeUI.initPage();
        function update() { document.getElementById('output').textContent = TextOpenVibeEngine.toSlug(document.getElementById('input').value); }
        document.getElementById('input').addEventListener('input', update);
        update();
    </script>
</body>
</html>
