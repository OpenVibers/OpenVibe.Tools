# ═══════════════════════════════════════════════════════════════
# Text.OpenVibe + Logo.OpenVibe — Nginx Vhost
# Single backend serving all text + logo subdomains.
#
# These exact server_names win over the gateway's *.openvibe.tools wildcard, so
# json./markdown./escape./diff./compare./slug. resolve here (the dedicated text
# pages) and the gateway's generic dev versions live on jsonfmt./md./entities./
# codediff./slugify. instead. reverse.openvibe.tools belongs to the Audio vhost;
# the text flipper is reversetext. / mirror. Keep in step with server/index.js.
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name
        text.openvibe.tools type.openvibe.tools fonts.openvibe.tools
        fancy.openvibe.tools zalgo.openvibe.tools ascii.openvibe.tools
        symbols.openvibe.tools unicode.openvibe.tools bubble.openvibe.tools
        glitch.openvibe.tools smallcaps.openvibe.tools cursive.openvibe.tools
        gothic.openvibe.tools wide.openvibe.tools monospaced.openvibe.tools
        braille.openvibe.tools morse.openvibe.tools binary.openvibe.tools
        case.openvibe.tools caps.openvibe.tools titlecase.openvibe.tools
        reversetext.openvibe.tools mirror.openvibe.tools
        clean.openvibe.tools strip.openvibe.tools
        count.openvibe.tools lines.openvibe.tools sort.openvibe.tools
        dedupe.openvibe.tools slug.openvibe.tools compare.openvibe.tools
        diff.openvibe.tools markdown.openvibe.tools json.openvibe.tools
        escape.openvibe.tools bio.openvibe.tools nickname.openvibe.tools
        username.openvibe.tools gamertag.openvibe.tools kaomoji.openvibe.tools
        emojis.openvibe.tools copypaste.openvibe.tools banner.openvibe.tools
        textart.openvibe.tools figlet.openvibe.tools
        logo.openvibe.tools title.openvibe.tools wordmark.openvibe.tools
        textlogo.openvibe.tools transparent.openvibe.tools badge.openvibe.tools
        sticker.openvibe.tools thumbnail.openvibe.tools cover.openvibe.tools
        channelart.openvibe.tools watermark.openvibe.tools neon.openvibe.tools
        overlay.openvibe.tools lowerthird.openvibe.tools
        ice.openvibe.tools peso.openvibe.tools currency.openvibe.tools
        mxn.openvibe.tools spanish.openvibe.tools espanol.openvibe.tools
        slang.openvibe.tools;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name
        text.openvibe.tools type.openvibe.tools fonts.openvibe.tools
        fancy.openvibe.tools zalgo.openvibe.tools ascii.openvibe.tools
        symbols.openvibe.tools unicode.openvibe.tools bubble.openvibe.tools
        glitch.openvibe.tools smallcaps.openvibe.tools cursive.openvibe.tools
        gothic.openvibe.tools wide.openvibe.tools monospaced.openvibe.tools
        braille.openvibe.tools morse.openvibe.tools binary.openvibe.tools
        case.openvibe.tools caps.openvibe.tools titlecase.openvibe.tools
        reversetext.openvibe.tools mirror.openvibe.tools
        clean.openvibe.tools strip.openvibe.tools
        count.openvibe.tools lines.openvibe.tools sort.openvibe.tools
        dedupe.openvibe.tools slug.openvibe.tools compare.openvibe.tools
        diff.openvibe.tools markdown.openvibe.tools json.openvibe.tools
        escape.openvibe.tools bio.openvibe.tools nickname.openvibe.tools
        username.openvibe.tools gamertag.openvibe.tools kaomoji.openvibe.tools
        emojis.openvibe.tools copypaste.openvibe.tools banner.openvibe.tools
        textart.openvibe.tools figlet.openvibe.tools
        logo.openvibe.tools title.openvibe.tools wordmark.openvibe.tools
        textlogo.openvibe.tools transparent.openvibe.tools badge.openvibe.tools
        sticker.openvibe.tools thumbnail.openvibe.tools cover.openvibe.tools
        channelart.openvibe.tools watermark.openvibe.tools neon.openvibe.tools
        overlay.openvibe.tools lowerthird.openvibe.tools
        ice.openvibe.tools peso.openvibe.tools currency.openvibe.tools
        mxn.openvibe.tools spanish.openvibe.tools espanol.openvibe.tools
        slang.openvibe.tools;

    ssl_certificate     /etc/letsencrypt/live/openvibe.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.tools/privkey.pem;

    access_log /var/log/nginx/text.openvibe.tools.access.log;
    error_log  /var/log/nginx/text.openvibe.tools.error.log;

    client_max_body_size 20m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static assets + hostname routing
    # Prometheus metrics are for loopback scrapes only (the app also 404s any proxied caller).
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
